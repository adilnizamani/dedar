<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dedar · Sindhi in Devanagari</title>
<meta name="description" content="Learn to read Sindhi in Devanagari script, with every letter next to its Arabic-script twin.">
<meta name="theme-color" content="#23306e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:600;font-display:swap;src:url(bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Naskh Arabic";font-weight:400;font-display:swap;src:url(noto-naskh-arabic-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Naskh Arabic";font-weight:600;font-display:swap;src:url(noto-naskh-arabic-arabic-600-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(noto-sans-devanagari-devanagari-400-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Sans Devanagari";font-weight:600;font-display:swap;src:url(noto-sans-devanagari-devanagari-600-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(noto-sans-devanagari-devanagari-700-normal.woff2) format("woff2")}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
/* Layout: app shell. Sticky top bar, one screen at a time, fixed bottom nav. Ajrak band as the brand mark. */
:root{
  --bg:#f3f4f9; --surface:#ffffff; --fg:#161a2e; --muted:#5a6080; --line:#dde0ec;
  --indigo:#23306e; --madder:#a8232d; --ochre:#b67a10; --ink:#0d1020; --good:#1f7a4a; --good-soft:#e2f3ea;
  --a-soft:#e6e9f7; --b-soft:#f8e5e6; --c-soft:#f8eedb;
  --special:#a8232d; --special-soft:#fbe9ea; --shadow:rgba(13,16,32,.12);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --dev:"Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif;
  --arab:"Noto Naskh Arabic", "Segoe UI", "Arial", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b30; --fg:#e8eaf6; --muted:#a2a8c8; --line:#2a3050;
  --indigo:#9aa8ff; --madder:#ff8a8f; --ochre:#f0b850; --ink:#05060d; --good:#6fd6a0; --good-soft:#163527;
  --a-soft:#1f2650; --b-soft:#3a1c24; --c-soft:#36290f;
  --special:#ff8a8f; --special-soft:#3a1c24; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b30; --fg:#e8eaf6; --muted:#a2a8c8; --line:#2a3050;
  --indigo:#9aa8ff; --madder:#ff8a8f; --ochre:#f0b850; --ink:#05060d; --good:#6fd6a0; --good-soft:#163527;
  --a-soft:#1f2650; --b-soft:#3a1c24; --c-soft:#36290f;
  --special:#ff8a8f; --special-soft:#3a1c24; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.dev{font-family:var(--dev)}
.ar{font-family:var(--arab);unicode-bidi:isolate}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tr{font-weight:400;color:var(--muted);white-space:nowrap}
.tr .ar{font-size:1.08em}
.tr{letter-spacing:0;text-transform:none}
.tr2{font-size:6.5px;font-weight:400;fill:var(--muted)}
.sv-ar{font-family:var(--arab)} .sv-dv{font-family:var(--dev)}
.intro-ex{display:flex;flex-direction:column;gap:6px}
.h1-tr{display:block;margin-top:6px;font-size:1.15rem}
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(5,6,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px var(--shadow)}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-x{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;font-size:1rem}
.sheet-pair{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--bg);border-radius:16px;padding:6px 10px}
.sheet-a{font-size:3.4rem;line-height:1.5;color:var(--madder)}
.sheet-d{font-family:var(--dev);font-size:3.4rem;font-weight:600;line-height:1.4}
.sheet-arrow{color:var(--muted);font-size:1.4rem}
.sheet-pair.small .sheet-a,.sheet-pair.small .sheet-d{font-size:2.2rem}
.sheet-say{display:flex;flex-direction:column;gap:2px;text-align:center}
.sheet-say b{font-size:1.15rem}
.sheet-say span{color:var(--muted)}
.sheet-ex{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.sheet-ex .sheet-pair{align-self:stretch}
.sheet-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skip{background:none;border:0;padding:6px;color:var(--indigo);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center}
ol.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
ol.steps li{padding-left:2px}
.abc-t td{padding:6px 8px}
.abc-t td.n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;width:1%}
.abc-t td.a{font-size:1.7rem;width:auto;color:var(--madder);text-align:center}
.abc-t td.d{font-size:1.7rem;width:auto;text-align:center}
.abc-t td.say-it{font-size:.92rem}
.abc-t td.say-it b{display:block;font-size:1.05rem}
.abc-t td.say-it small{color:var(--muted);line-height:1.3;display:block}
.abc-t td.l{text-align:center;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums}
.abc-t tr.go{cursor:pointer}
.abc-t tr.go:hover td{background:var(--a-soft)}
.abc-t tr.same td.d{color:var(--muted)}
.marks{display:flex;flex-direction:column;gap:8px}
.mark{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mark-pair{display:flex;align-items:center;gap:8px;flex:none;min-width:120px}
.mark-a{font-size:1.7rem;color:var(--madder)}
.mark-arrow{color:var(--muted)}
.mark-d{font-family:var(--dev);font-size:1.7rem;font-weight:600}
.mark-txt{min-width:0;font-size:.95rem}
.mark-txt p{margin:2px 0 0;color:var(--muted)}
.mark-txt .ar{font-size:1.1rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.abc{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;position:relative;min-width:0}
.abc:hover:not(:disabled){border-color:var(--indigo)}
.abc:disabled{cursor:default;opacity:.7}
.abc-n{position:absolute;top:4px;left:7px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.abc-a{font-family:var(--arab);font-size:1.9rem;line-height:1.5;color:var(--madder)}
.abc-d{font-family:var(--dev);font-size:1.7rem;font-weight:600;line-height:1.3}
.abc-l{font-size:.72rem;color:var(--muted);white-space:nowrap}
.abc-l .ar{font-size:.95rem}
.abc.sp{background:var(--special-soft);border-color:var(--special)}
.abc.same .abc-d{color:var(--muted)}

/* Shell */
.band{height:14px;background-color:var(--indigo);
  background-image:radial-gradient(circle at 50% 50%, var(--madder) 0 3px, transparent 3.5px),
    conic-gradient(from 45deg at 50% 50%, var(--ink) 0 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0);
  background-size:14px 14px,14px 14px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;font-size:1.2rem;flex:none}
.appbar-title{font-family:var(--display);font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar-step{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap}
.view{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;cursor:pointer;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center}
.nav button.on{color:var(--indigo)}
.nav button.on .pill{background:var(--a-soft)}

/* Cards and buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{font-weight:700;border-radius:14px;padding:12px 18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn.big{font-size:1.08rem;padding:14px 18px;width:100%}
.btn.soft{background:var(--a-soft);border-color:transparent;color:var(--indigo)}
.btn.quizb{border-color:var(--ochre);background:var(--c-soft)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* Home */
.pair{display:flex;align-items:center;gap:12px}
.pair .big{font-family:var(--dev);font-size:3.6rem;line-height:1;color:var(--indigo);font-weight:600}
.pair .big-ar{font-family:var(--arab);font-size:2.9rem;line-height:1;color:var(--madder)}
.pair .eq{font-size:1.4rem;color:var(--muted)}
.lede{font-size:1.08rem;color:var(--muted);max-width:52ch}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--madder),var(--ochre));transition:width .4s ease}
.prog-meta{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.next-up{display:flex;flex-direction:column;gap:4px}
.next-up b{font-family:var(--display);font-size:1.3rem}
.tour-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tour-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:0;border-radius:14px;padding:12px;cursor:pointer}
.tour-item .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--indigo);color:var(--indigo);flex:none}
.tour-item.seen .n{background:var(--indigo);color:var(--surface)}
.tour-item .t{display:flex;flex-direction:column;min-width:0}
.tour-item .t small{color:var(--muted)}
.tour-item .go{margin-left:auto;color:var(--indigo);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.fact:hover{border-color:var(--indigo)}
.fact b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.fact span{font-size:.85rem;color:var(--muted)}
.fact .cue{color:var(--indigo);font-weight:700;margin-top:4px}
@media (max-width:480px){.facts{grid-template-columns:1fr}}
.paused{background:var(--good-soft);border:2px solid var(--good);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.paused b{font-family:var(--display);font-size:1.15rem}

/* Tour */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--indigo);width:26px;border-radius:99px}
.stages{display:flex;flex-direction:column;gap:10px}
.stage{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.stage.a{background:var(--a-soft)} .stage.b{background:var(--b-soft)} .stage.c{background:var(--c-soft)}
.stage .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage .tag{font-family:var(--display);font-weight:800;font-size:1.6rem}
.a-c{color:var(--indigo)} .b-c{color:var(--madder)} .c-c{color:var(--ochre)}
.stage .name{font-weight:700;font-size:1.08rem}
.stage small{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.stage .ex{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:.95rem}
.stage .ex .dev{font-size:1.3rem}
.stage .ex .ar{font-size:1.2rem}
.split{display:flex;height:44px;border-radius:12px;overflow:hidden;font-weight:700;font-size:.85rem}
.split div{display:grid;place-items:center;color:var(--surface);min-width:0}
.split .a{background:var(--indigo)} .split .b{background:var(--madder)} .split .c{background:var(--ochre)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.why li{display:flex;gap:10px}
.why li b.k{font-family:var(--display);flex:none;width:1.4em}
.recipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:r}
.recipe div{background:var(--bg);border-radius:12px;padding:12px;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.recipe div::before{counter-increment:r;content:counter(r);font-family:var(--display);font-weight:800;color:var(--madder);font-size:1.3rem}
@media (max-width:560px){.recipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cmds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:2px solid var(--indigo);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.cmd:hover{background:var(--a-soft)}
.cmd b{font-family:var(--display);font-weight:800;color:var(--indigo);font-size:1.05rem}
.cmd span{font-size:.86rem;color:var(--muted)}

/* Mouth diagrams */
.key svg{width:100%;max-width:520px;height:auto;margin:0 auto;display:block}
.face{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;opacity:.55}
.roof{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.tongue-fill{fill:var(--b-soft);stroke:var(--madder);stroke-width:2}
.tooth{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.lip{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-linecap:round}
.hit{fill:var(--ochre)}
.ring{fill:none;stroke:var(--ochre);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.2)}}
.lbl{font-family:var(--body);font-size:8px;font-weight:700;fill:var(--fg)}
.lbl.t{fill:var(--madder)}
.lead{stroke:var(--muted);stroke-width:.8;fill:none}
.stations{display:flex;flex-direction:column}
.st{display:flex;align-items:center;gap:14px;padding-block:12px;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st svg{width:120px;flex:none;height:auto}
.st .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st .ltr{font-family:var(--dev);font-size:1.6rem;font-weight:600;line-height:1.2}
.st .ltr .ar{font-size:1.3rem;color:var(--madder);font-weight:400}
.st small{font-size:.9rem;color:var(--muted)}
.st .go{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--indigo);font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.arrow{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.arrow i{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--indigo),var(--madder))}

/* Specials */
.specials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sp{background:var(--special-soft);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sp .from{font-family:var(--dev);font-size:1.3rem;color:var(--muted)}
.sp .to{font-family:var(--dev);font-size:2.8rem;line-height:1.2;color:var(--special);font-weight:600}
.sp .to-ar{font-family:var(--arab);font-size:1.6rem}
.sp .arr{font-size:.85rem;color:var(--muted)}
@media (min-width:600px){.specials{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Outline */
.ol-stage{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.ol-stage h3{font-size:1.1rem}
.ol-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.ol-row:hover{border-color:var(--indigo)}
.ol-num{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.ol-row.done .ol-num{color:var(--surface)}
.ol-row.a.done .ol-num{background:var(--indigo);border-color:var(--indigo)}
.ol-row.b.done .ol-num{background:var(--madder);border-color:var(--madder)}
.ol-row.c.done .ol-num{background:var(--ochre);border-color:var(--ochre)}
.ol-row.cur{border:2px solid var(--fg)}
.ol-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.ol-txt b{font-size:1.02rem;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
.lc{font-family:var(--dev);font-size:1.05rem;background:var(--bg);border-radius:8px;padding:1px 7px;white-space:nowrap}
.lc .ar{font-size:.95rem;color:var(--madder)}
.ol-min{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:6px}

/* Lesson */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font-weight:700;font-variant-numeric:tabular-nums;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.chip.done{color:var(--surface)}
.chip.a.done{background:var(--indigo);border-color:var(--indigo)}
.chip.b.done{background:var(--madder);border-color:var(--madder)}
.chip.c.done{background:var(--ochre);border-color:var(--ochre)}
.chip.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lesson-head{padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.lesson-head.a{background:var(--a-soft)} .lesson-head.b{background:var(--b-soft)} .lesson-head.c{background:var(--c-soft)}
.lesson-head h2{font-size:1.5rem}
.lesson-head .tr{font-size:1.05rem;white-space:normal}
.lesson-head .hint{color:var(--muted);font-size:.98rem}
.lesson-body{padding:18px;display:flex;flex-direction:column;gap:22px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:2px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.d{font-family:var(--dev);font-size:2.2rem;line-height:1.3;font-weight:600;width:32%}
td.a{font-size:1.9rem;line-height:1.3;width:28%;color:var(--madder)}
td.s{font-size:1rem;color:var(--muted)}
tr.special td{background:var(--special-soft)}
tr.special td.d{color:var(--special)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--special);color:var(--surface);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.block{display:flex;flex-direction:column;gap:10px}
.block h4{margin:0;font-family:var(--display);font-size:1rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.tricks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tricks li{display:flex;gap:10px;align-items:flex-start}
.tricks li::before{content:"✦";color:var(--ochre);flex:none;line-height:1.55}
.tricks .dev{font-size:1.25rem}
.tricks .ar{font-size:1.15rem}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.word{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.word .w-d{font-family:var(--dev);font-size:2rem;font-weight:600;line-height:1.3}
.word .w-a{font-family:var(--arab);font-size:1.5rem;color:var(--madder)}
.word .w-m{font-size:.92rem;color:var(--muted)}
.say{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--indigo);background:var(--surface);color:var(--indigo);cursor:pointer;display:inline-grid;place-items:center;padding:0;vertical-align:middle}
.say svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.say svg path:first-child{fill:currentColor}
.say:hover{background:var(--a-soft)}
.say.playing{background:var(--indigo);color:var(--surface)}
.g-hit{color:var(--madder)}
.match{background:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.m-top{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.m-prompt{font-family:var(--arab);font-size:3.4rem;line-height:1.4;text-align:center;color:var(--madder);background:var(--surface);border-radius:14px}
.m-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.m-opt{font-family:var(--dev);font-size:2.2rem;font-weight:600;line-height:1.5;background:var(--surface);border:2px solid var(--line);border-radius:14px;cursor:pointer;min-width:0}
.m-opt:hover:not(:disabled){border-color:var(--indigo)}
.m-opt.right{border-color:var(--good);background:var(--good-soft)}
.m-opt.wrong{border-color:var(--madder);background:var(--special-soft);opacity:.6}
.m-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.m-done b{font-family:var(--display);font-size:1.3rem;color:var(--good)}
.g-dim{opacity:.28}
.rec-item{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-item.has{border-color:var(--good);background:var(--good-soft)}
.rec-text{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.rec-d{font-family:var(--dev);font-size:2rem;font-weight:600;line-height:1.3}
.rec-a .ar{font-size:1.4rem;color:var(--madder)}
.rec-text small{color:var(--muted);font-size:.9rem}
.rec-btns{display:flex;gap:8px;flex-wrap:wrap}
.recb{border:2px solid var(--madder);color:var(--madder);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;min-width:112px}
.recb.on{background:var(--madder);color:var(--surface);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.playb{border:2px solid var(--indigo);color:var(--indigo);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
td.h{width:56px;text-align:center}
.w-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-prompt .say{margin-top:6px}
.reveal{font-size:.95rem;font-weight:700;align-self:flex-start;background:var(--a-soft);border:0;border-radius:10px;padding:6px 12px;color:var(--indigo);cursor:pointer}
.lesson-foot{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tool{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.8rem;font-weight:700;min-width:0}
.tool .i{font-size:1.15rem;line-height:1.3}
.tool:disabled{opacity:.35;cursor:default}
.tool.q{border-color:var(--ochre);background:var(--c-soft)}

/* Quiz */
.quiz{border-top:3px solid var(--ochre);background:var(--c-soft);padding:18px;display:flex;flex-direction:column;gap:14px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.quiz-top b{font-family:var(--display);font-size:1.15rem}
.quiz-top span{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q-prompt{font-family:var(--dev);font-size:3.2rem;font-weight:600;line-height:1.2;text-align:center;background:var(--surface);border-radius:14px;padding:10px}
.q-ask{text-align:center;font-weight:700}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q-opt{font-family:var(--arab);font-size:1.8rem;line-height:1.5;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;min-width:0}
.q-opt:hover:not(:disabled){border-color:var(--indigo)}
.q-opt.right{border-color:var(--good);background:var(--good-soft)}
.q-opt.wrong{border-color:var(--madder);background:var(--special-soft)}
.q-opt:disabled{cursor:default}
.q-msg{text-align:center;font-weight:700;min-height:1.5em}
.q-msg.right{color:var(--good)} .q-msg.wrong{color:var(--madder)}
.q-end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.q-end .score{font-family:var(--display);font-size:2.4rem;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow);z-index:10;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<div class="band" aria-hidden="true"></div>
<header class="appbar"><div class="appbar-in" id="appbar"></div></header>
<main class="view" id="view" aria-live="polite"></main>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const S = t=>`<bdi class="ar" dir="rtl" lang="sd">${t}</bdi>`;
const D = t=>`<span class="dev">${t}</span>`;
const TR = (sd,dv)=>`<span class="tr">(${S(sd)} · ${D(dv)})</span>`;

const STAGES = {
 a:{name:"Consonants", sd:"حرفِ صحيح", dv:"व्यंजन", cls:"a-c", color:"var(--indigo)"},
 b:{name:"Vowels", sd:"حرفِ علت", dv:"स्वर", cls:"b-c", color:"var(--madder)"},
 c:{name:"Reading", sd:"پڙهڻ", dv:"पढ़णु", cls:"c-c", color:"var(--ochre)"}
};
const LESSONS = [
 {stage:"a", min:10, title:"Throat group", sd:"ڳلو", dv:"ॻलो", hint:"Back of your tongue touches the back of the roof of your mouth.",
  letters:[["क","ڪ","ka"],["ख","ک","kha"],["ग","گ","ga"],["ॻ","ڳ","Sindhi g",1],["घ","گھ","gha"],["ङ","ڱ","nga"]],
  tricks:[`Line underneath = Sindhi extra letter: ${D("ग")} ${S("(گ)")} becomes ${D("ॻ")} ${S("(ڳ)")}.`,
          `The h-letters ${D("ख")} ${S("(ک)")} and ${D("घ")} ${S("(گھ)")} are <b>new shapes</b>, not "letter + h". Memorize them as pictures.`],
  wordsLabel:"Match it", words:[]},
 {stage:"a", min:10, title:"Roof-of-mouth group", sd:"وات جي ڇت", dv:"वात जी छत", hint:"Middle of your tongue touches the hard roof of your mouth.",
  letters:[["च","چ","cha"],["छ","ڇ","chha"],["ज","ج","ja"],["ॼ","ڄ","Sindhi j",1],["झ","جھ","jha"],["ञ","ڃ","nya"]],
  tricks:[`Same trick again: ${D("ज")} ${S("(ج)")} with a line underneath is ${D("ॼ")} ${S("(ڄ)")}.`,
          `${D("ञ")} ${S("(ڃ)")} is rare. Just recognize it. Don't drill it.`],
  wordsLabel:"Match it", words:[]},
 {stage:"a", min:10, title:"Tongue-curl group", sd:"مُڙيل ڄڀ", dv:"मुड़ियल ॼिभ", hint:"Curl your tongue tip back and tap the roof of your mouth.",
  letters:[["ट","ٽ","ṭa"],["ठ","ٺ","ṭha"],["ड","ڊ","ḍa"],["ॾ","ڏ","Sindhi d",1],["ढ","ڍ","ḍha"],["ण","ڻ","ṇa"]],
  tricks:[`Line underneath again: ${D("ड")} ${S("(ڊ)")} becomes ${D("ॾ")} ${S("(ڏ)")}.`,
          `${D("ण")} ${S("(ڻ)")} is the n in ${S("پاڻي")}. You use it every day.`],
  wordsLabel:"Match it", words:[]},
 {stage:"a", min:10, title:"Teeth group", sd:"ڏند", dv:"ॾंद", hint:"Tongue tip touches the back of your upper teeth.",
  letters:[["त","ت","ta"],["थ","ٿ","tha"],["द","د","da"],["ध","ڌ","dha"],["न","ن","na"]],
  tricks:[`${D("ट")} ${S("(ٽ)")} has a <b>round hook</b>. ${D("त")} ${S("(ت)")} has a <b>flat crossbar</b>.`,
          `${D("थ")} ${S("(ٿ)")} and ${D("ध")} ${S("(ڌ)")} have a <b>gap in the top line</b>. Look for the gap.`],
  wordsLabel:"Match it", words:[]},
 {stage:"a", min:10, title:"Lip group", sd:"چپ", dv:"चप", hint:"Only your lips do the work.",
  letters:[["प","پ","pa"],["फ","ڦ","pha"],["ब","ب","ba"],["ॿ","ٻ","Sindhi b",1],["भ","ڀ","bha"],["म","م","ma"]],
  tricks:[`Last extra letter: ${D("ब")} ${S("(ب)")} with a line underneath is ${D("ॿ")} ${S("(ٻ)")}. You now know all 4.`,
          `${D("फ")} ${S("(ڦ)")} is ${D("प")} ${S("(پ)")} with a <b>curl on the right</b>.`],
  wordsLabel:"Match it", words:[]},
 {stage:"a", min:10, title:"The rest", sd:"باقي اکر", dv:"बाक़ी अखर", hint:"Letters that don't belong to one mouth group. Easy ones.",
  letters:[["य","ي","ya"],["र","ر","ra"],["ल","ل","la"],["व","و","va"],["स","س","sa"],["श","ش","sha"],["ह","ه","ha"]],
  tricks:[`${D("र")} ${S("(ر)")} is tiny and changes shape with vowels: ${D("रु")} ${S("(رُ)")}. Watch it.`,
          `${D("स")} ${S("(س)")} has a full top line. ${D("श")} ${S("(ش)")} has a <b>gap</b> in it.`],
  wordsLabel:"Read it", words:[["पर","پر","but"],["हर","هر","every"]]},
 {stage:"a", min:8, title:"Dotted letters", sd:"نقطي وارا اکر", dv:"नुक़्ते वारा अखर", hint:"A dot underneath = a borrowed or extra sound.",
  letters:[["ड़","ڙ","ṛa"],["ज़","ز","za"],["फ़","ف","fa"],["ख़","خ","kha (throaty)"],["ग़","غ","gha (throaty)"],["क़","ق","qa"]],
  tricks:[`Dot underneath = same base letter, new sound: ${D("ज")} ${S("(ج)")} becomes ${D("ज़")} ${S("(ز)")}.`,
          `Don't mix up the <b>dot</b> (borrowed sound) with the <b>line</b> (Sindhi extra letter).`],
  wordsLabel:"Read it", words:[["ख़बर","خبر","news"],["ज़बर","زبر","zabar, the vowel mark"]]},
 {stage:"b", min:10, title:"Vowels on their own", sd:"حرفِ علت", dv:"स्वर", hint:"Used at the start of a word. Short and long come in pairs.",
  letters:[["अ","اَ","a"],["आ","آ","aa"],["इ","اِ","i"],["ई","اِي","ee"],["उ","اُ","u"],["ऊ","اُو","oo"],["ए","اي","e"],["ओ","او","o"]],
  tricks:[`Long = short + an extra stroke: ${D("अ")} ${S("(اَ)")} becomes ${D("आ")} ${S("(آ)")}.`,
          `Every consonant already has a hidden <b>a</b>: ${D("क")} ${S("(ڪَ)")} is read "ka".`],
  wordsLabel:"Read it", words:[["अगर","اگر","if"],["आस","آس","hope"]]},
 {stage:"b", min:12, title:"Vowel marks, part 1", sd:"اعراب", dv:"मात्रा", hint:"Inside a word, vowels shrink into marks attached to the letter.",
  letters:[["का","ڪا","ा = aa"],["कि","ڪِ","ि = i"],["की","ڪي","ी = ee"]],
  tricks:[`${D("ि")} is written <b>before</b> the letter but said <b>after</b> it: ${D("कि")} ${S("(ڪِ)")} = "ki".`,
          `These marks work like your alif, zer and ye: ${D("ा")} = ${S("(ا)")}, ${D("ि")} = ${S("(ِ)")}, ${D("ी")} = ${S("(ي)")}.`],
  wordsLabel:"Read it", words:[["पाणी","پاڻي","water"],["मानी","ماني","bread"]]},
 {stage:"b", min:12, title:"Vowel marks, part 2", sd:"اعراب", dv:"मात्रा", hint:"Marks below and above the letter.",
  letters:[["कु","ڪُ","ु = u"],["कू","ڪُو","ू = oo"],["के","ڪي","े = e"],["कै","ڪَي","ै = ai"],["को","ڪو","ो = o"],["कौ","ڪَو","ौ = au"]],
  tricks:[`${D("ु")} and ${D("ू")} <b>hang below</b>, like your pesh ${S("(ُ)")}.`,
          `${D("ो")} is just ${D("ा")} + ${D("े")} on top. Spot the pattern.`],
  wordsLabel:"Read it", words:[["कुतो","ڪُتو","dog"],["छोकरो","ڇوڪرو","boy"]]},
 {stage:"c", min:10, title:"Sindhi word endings", sd:"لفظن جي پڇاڙي", dv:"लफ़्ज़नि जी पछाड़ी", hint:"The short vowel you often skip in Arabic script is always written in Devanagari.",
  letters:[["घरु","گھرُ","ends in u"],["राति","راتِ","ends in i"],["छोकरो","ڇوڪرو","ends in o"]],
  tricks:[`Most Sindhi nouns end in a short vowel. Devanagari <b>always shows it</b>: ${D("घरु")} ${S("(گھرُ)")}.`,
          `This is your advantage. You already hear these endings. Now you just see them.`],
  wordsLabel:"Read it", words:[["राति","راتِ","night"],["वणु","وڻُ","tree"]]},
 {stage:"c", min:15, title:"Short sentences", sd:"ننڍا جملا", dv:"नंढा जुमला", hint:"Put it all together. One new mark: the nasal dot.",
  letters:[["ं","ں","nasal dot"],["मां","مان","I"],["आहियां","آهيان","am"]],
  tricks:[`The dot on top ${D("ं")} = your noon ghunna ${S("(ں)")}.`,
          `Read word by word. Say it out loud. Your ear will confirm it.`],
  wordsLabel:"Read it", words:[["मां घरि आहियां","مان گھرِ آهيان","I am at home"],["पाणी थधो आहे","پاڻي ٿڌو آهي","the water is cold"]]},
 {stage:"c", min:15, title:"Joined letters + typing", sd:"ڳنڍيل اکر", dv:"ॻंढियल अखर", hint:"When two consonants meet, the first one often gets cut in half.",
  letters:[["्","ْ","halant = sukun"],["स्त","سْت","st"],["त्र","تْر","tr"],["क्ष","ڪْش","ksh"],["ल्ह","لھ","lh"]],
  tricks:[`The small slash ${D("्")} is your sukun ${S("(ْ)")}. It removes the hidden "a".`,
          `Add a Sindhi or Hindi <b>Devanagari keyboard</b> on your phone. Type what you hear and check the shape.`],
  wordsLabel:"Read it", words:[["दोस्तु","دوستُ","friend"],["ॻाल्हि","ڳالھِ","talk"]]}
];
const APP_VERSION = "10";
const TOTAL = LESSONS.reduce((s,l)=>s+l.min,0);
const fmt = m => `${Math.floor(m/60)} h ${m%60} min`;
const stageMin = s => LESSONS.filter(l=>l.stage===s).reduce((x,l)=>x+l.min,0);
const stageRange = s => { const ix=LESSONS.map((l,i)=>l.stage===s?i+1:0).filter(Boolean); return [ix[0], ix[ix.length-1], ix.length]; };
const consonantCount = LESSONS.filter(l=>l.stage==="a").reduce((x,l)=>x+l.letters.length,0);
const TOUR = [
 {k:"plan", title:"How the course works", sub:"3 parts, 13 short lessons", min:1},
 {k:"mouth", title:"Where sounds come from", sub:"Why the letters are in this order", min:1},
 {k:"extra", title:"Sindhi's special letters", sub:"4 sounds that Hindi doesn't have", min:1}
];

/* State */
let done=new Set(), cur=0, seen=new Set(), quiz=null, screen="home", stack=[], pausedMsg=false;
try{ done=new Set(JSON.parse(localStorage.getItem("dedar-done")||"[]")); cur=+localStorage.getItem("dedar-cur")||0; seen=new Set(JSON.parse(localStorage.getItem("dedar-tour")||"[]")); }catch(e){}
if(!(cur>=0&&cur<LESSONS.length)) cur=0;
function save(){ try{ localStorage.setItem("dedar-done",JSON.stringify([...done])); localStorage.setItem("dedar-cur",String(cur)); localStorage.setItem("dedar-tour",JSON.stringify([...seen])); }catch(e){} }

const $=id=>document.getElementById(id);
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function show(s, push=true){ closeLetter(); if(push && s!==screen) stack.push(screen); screen=s; if(s.startsWith("tour-")){ seen.add(s.slice(5)); save(); } if(s!=="home") pausedMsg=false; render(); window.scrollTo(0,0); }
function back(){ if(screen==="studio" && studioLesson!==null){ studioLesson=null; render(); window.scrollTo(0,0); return; } const p=stack.pop()||"home"; screen=p; render(); window.scrollTo(0,0); }
function openLesson(i){ cur=i; quiz=null; match=null; save(); show("lesson"); }

/* Mouth SVG */
const MOUTH=[
 {name:"Throat", sd:"ڳلو", dv:"ॻलो", how:"Back of tongue goes up", ex:["क","ڪ"], lesson:0,
  tongue:"M22 80 C14 40 30 22 44 33 C60 44 80 52 92 60 L92 67 C70 77 42 83 22 80Z", hit:[30,30]},
 {name:"Roof of mouth", sd:"وات جي ڇت", dv:"वात जी छत", how:"Middle of tongue goes up", ex:["च","چ"], lesson:1,
  tongue:"M22 80 C24 62 36 48 48 34 C56 25 66 24 76 36 C84 46 90 54 92 60 L92 67 C70 77 42 83 22 80Z", hit:[61,23]},
 {name:"Tongue-curl", sd:"مُڙيل ڄڀ", dv:"मुड़ियल ॼिभ", how:"Tongue tip curls back and up", ex:["ट","ٽ"], lesson:2,
  tongue:"M22 80 C30 64 54 60 70 57 C77 54 79 42 79 31 C83 32 86 44 85 54 C87 61 90 64 92 66 L92 67 C70 77 42 83 22 80Z", hit:[81,27]},
 {name:"Teeth", sd:"ڏند", dv:"ॾंद", how:"Tongue tip touches upper teeth", ex:["त","ت"], lesson:3,
  tongue:"M22 80 C30 64 54 58 76 52 C85 48 90 45 93 45 C94 51 93 58 92 64 L92 67 C70 77 42 83 22 80Z", hit:[92,44]},
 {name:"Lips", sd:"چپ", dv:"चप", how:"Lips press together", ex:["प","پ"], lesson:4,
  tongue:"M22 80 C30 67 56 62 78 62 C86 62 91 64 92 66 L92 67 C70 77 42 83 22 80Z", hit:[110,53], closed:true}
];
function mouthParts(m){
  const lips=m.closed
    ? `<path class="lip" d="M99 33 C109 34 113 44 110 53"/><path class="lip" d="M110 53 C113 62 109 71 99 73"/>`
    : `<path class="lip" d="M99 33 C109 34 113 42 109 49"/><path class="lip" d="M109 57 C113 64 109 71 99 73"/>`;
  return `<path class="face" d="M100 -6 C104 4 113 12 116 20 C115 25 107 27 101 29 C100 30 99 31 99 33"/>
    <path class="face" d="M99 73 C103 75 107 80 106 86 C105 92 98 96 88 96"/>
    <path class="face" d="M14 62 L14 96"/>
    <path class="roof" d="M14 62 C14 32 40 21 60 21 C78 21 90 27 95 36"/>
    <path class="tongue-fill" d="${m.tongue}"/>
    <rect class="tooth" x="93" y="35" width="6" height="13" rx="2"/>
    <rect class="tooth" x="93" y="60" width="6" height="12" rx="2"/>
    ${lips}`;

/* Letter card: slides up when a letter is tapped in the alphabet list. */
function openLetter(i){
  const [a,d,l,same,rom,how]=ABC[i], [ea,ed,em]=EX[i], sp=/[ٻڄڏڳ]/.test(a);
  closeLetter();
  const back=document.createElement("div"); back.className="sheet-back"; back.id="sheetBack";
  back.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Letter ${i+1}: ${a} is ${d}">
    <div class="sheet-top"><span class="eyebrow">Letter ${i+1} of ${ABC.length}${sp?' · <span class="badge" style="margin:0">Sindhi only</span>':""}</span><button class="sheet-x" id="sheetX" aria-label="Close">✕</button></div>
    <div class="sheet-pair"><span class="sheet-a">${S(a)}</span><span class="sheet-arrow">→</span><span class="sheet-d">${d}</span></div>
    <div class="sheet-say"><b>Say it: ${rom}</b><span>${how}</span>${same?`<span>Devanagari uses ${D(d)} for ${S(same)} and ${S(a)} alike.</span>`:""}</div>
    <div class="sheet-ex"><span class="eyebrow">Example word</span>
      <div class="sheet-pair small"><span class="sheet-a">${S(ea)}</span><span class="sheet-arrow">→</span><span class="sheet-d">${ed}</span></div>
      <span class="muted">means "${em}"</span></div>
    ${l?`<button class="btn primary big" id="sheetLesson">Open lesson ${l} →</button>`:`<p class="muted">This letter is rare, so no lesson teaches it.</p>`}
    <div class="sheet-nav"><button class="btn" id="sheetPrev" ${i===0?"disabled":""}>← Previous</button><button class="btn" id="sheetNext" ${i===ABC.length-1?"disabled":""}>Next →</button></div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{ if(e.target===back) closeLetter(); };
  $("sheetX").onclick=closeLetter;
  $("sheetPrev").onclick=()=>openLetter(i-1);
  $("sheetNext").onclick=()=>openLetter(i+1);
  const sl=$("sheetLesson"); if(sl) sl.onclick=()=>{ closeLetter(); openLesson(l-1); };
  $("sheetX").focus();
}
function closeLetter(){ const b=$("sheetBack"); if(b) b.remove(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLetter(); });

/* Commands */
function doCmd(c){
  if(c==="next"){ if(cur<LESSONS.length-1){ openLesson(cur+1); toast(`Lesson ${cur+1}: ${LESSONS[cur].title}`);} else toast("This is the last lesson. Well done!"); }
  else if(c==="quiz"){ if(screen!=="lesson") show("lesson"); startQuiz(); }

}

/* What the learner knows by each lesson: every character taught in that lesson or earlier. */
const KNOWN = LESSONS.map((_,i)=>{ const s=new Set(); for(let j=0;j<=i;j++) LESSONS[j].letters.forEach(x=>[...x[0]].forEach(c=>s.add(c))); return s; });
const NEW = LESSONS.map((l,i)=>new Set(l.letters.flatMap(x=>[...x[0]]).filter(c=>i===0 || !KNOWN[i-1].has(c))));
const SEG = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter("hi",{granularity:"grapheme"}) : null;
const graphemes = t => SEG ? [...SEG.segment(t)].map(x=>x.segment) : [...t];
const hasUnknown = (t,i) => [...t].some(c=>c!==" " && !KNOWN[i].has(c));
function markWord(t,i){
  return graphemes(t).map(g=>{
    if(g===" ") return " ";
    const cs=[...g];
    if(cs.some(c=>NEW[i].has(c))) return `<span class="g-hit">${g}</span>`;
    if(cs.some(c=>!KNOWN[i].has(c))) return `<span class="g-dim">${g}</span>`;
    return g;
  }).join("");
}

function db(){ if(!dbP) dbP=new Promise((res,rej)=>{ const r=indexedDB.open("dedar-studio",1); r.onupgradeneeded=()=>r.result.createObjectStore("clips"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbP; }
async function idb(mode,fn){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips",mode); const r=fn(t.objectStore("clips")); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }

async function startRec(id){
  try{
    if(!mic) mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){ toast("Microphone is blocked. Allow the microphone for this site, then try again."); return; }
  const types=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4","audio/webm"];
  const mt=types.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t))||"";
  const chunks=[], r=new MediaRecorder(mic, mt?{mimeType:mt}:undefined);
  rec=r; recId=id;
  r.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  r.onstop=async()=>{
    clearTimeout(recTimer); rec=null; recId=null;
    const blob=new Blob(chunks,{type:r.mimeType||mt||"audio/webm"});
    try{ await clipPut(id,blob); recKeys.add(id); toast("Saved ✓"); }catch(e){ toast("Couldn't save. Try again."); }
    studioLessonView();
  };
  r.start(); studioLessonView();
  recTimer=setTimeout(stopRec,8000);
}
function stopRec(){ if(rec && rec.state!=="inactive") rec.stop(); }

const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+sz;
  }
  const cd=central.reduce((x,p)=>x+p.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cd,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
async function downloadZip(){
  const keys=await clipKeys(); if(!keys.length){ toast("Nothing recorded yet."); return; }
  const files=[], list=[];
  for(const k of keys){
    const b=await clipGet(k); if(!b) continue;
    const ext=b.type.includes("ogg")?"ogg":b.type.includes("mp4")?"m4a":"webm";
    files.push({name:`${k}.${ext}`, data:new Uint8Array(await b.arrayBuffer())});
    const m=/^([lw])(\d+)-(\d+)$/.exec(k); const L=m&&LESSONS[+m[2]];
    list.push(`${k}\t${L?(m[1]==="l"?L.letters[+m[3]][0]:L.words[+m[3]][0]):""}`);
  }
  files.push({name:"list.txt", data:new TextEncoder().encode(list.join("\n"))});
  const url=URL.createObjectURL(makeZip(files)), a=document.createElement("a");
  a.href=url; a.download="dedar-recordings.zip"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  toast("Downloaded. Now send dedar-recordings.zip to Claude.");
}

/* Quiz */
const isMark=s=>/^[ऀ-ःऺ-ॏ]$/.test(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function startQuiz(){
  const l=LESSONS[cur];
  const items=[...l.letters.map((x,r)=>({d:x[0],a:x[1],kind:"l",id:`l${cur}-${r}`})).filter(x=>!isMark(x.d)),...l.words.map((w,k)=>({d:w[0],a:w[1],kind:"w",id:`w${cur}-${k}`})).filter(x=>!hasUnknown(x.d,cur))];
  const poolL=LESSONS.flatMap(x=>x.letters.filter(y=>!isMark(y[0])).map(y=>y[1]));
  const poolW=LESSONS.flatMap(x=>x.words.map(y=>y[1]));
  quiz={i:0,score:0,answered:false,qs:shuffle(items).slice(0,5).map(q=>{
    const own=items.filter(x=>x.kind===q.kind&&x.a!==q.a).map(x=>x.a);
    const pool=[...new Set([...shuffle(own),...shuffle(q.kind==="l"?poolL:poolW)])].filter(a=>a!==q.a);
    return {...q,opts:shuffle([q.a,...pool.slice(0,3)])};
  })};
  renderLessonScreen();
  const qb=$("quizBox"); if(qb) qb.scrollIntoView({block:"start"});
}
function quizHTML(){
  if(!quiz) return "";
  const n=quiz.qs.length;
  if(quiz.i>=n){
    const msg=quiz.score===n?"Perfect! Mark this lesson done.":quiz.score>=n-1?"Very good. One more look and you've got it.":"Good try. Read the table once more, then quiz again.";
    return `<div class="quiz" id="quizBox"><div class="q-end"><span class="score">${quiz.score} / ${n}</span><p>${msg}</p>
      <div class="row"><button class="btn quizb" id="qAgain">Quiz again</button><button class="btn" id="qClose">Close quiz</button></div></div></div>`;
  }
  const q=quiz.qs[quiz.i];
  return `<div class="quiz" id="quizBox">
    <div class="quiz-top"><b>Quiz · Lesson ${cur+1}</b> ${TR("امتحان","इम्तिहान")}<span>Question ${quiz.i+1} of ${n} · Score ${quiz.score}</span></div>
    <div class="q-prompt">${q.d}<div>${sayBtn(q.d,q.id)}</div></div>
    <p class="q-ask">Which one is the same in Arabic script?</p>
    <div class="q-opts">${q.opts.map(o=>`<button class="q-opt" dir="rtl" lang="sd" data-a="${o}">${o}</button>`).join("")}</div>
    <p class="q-msg" id="qMsg"></p>
    <div class="row" style="justify-content:space-between"><button class="btn" id="qClose">Close quiz</button><button class="btn primary" id="qNext" hidden>${quiz.i===n-1?"See my score":"Next question →"}</button></div>
  </div>`;
}
function bindQuiz(){
  if(!quiz) return;
  const c=$("qClose"); if(c) c.onclick=()=>{quiz=null;renderLessonScreen();};
  const a=$("qAgain"); if(a) a.onclick=startQuiz;
  document.querySelectorAll(".q-opt").forEach(b=>b.onclick=()=>{
    if(quiz.answered) return; quiz.answered=true;
    const q=quiz.qs[quiz.i], ok=b.dataset.a===q.a; if(ok) quiz.score++;
    document.querySelectorAll(".q-opt").forEach(x=>{x.disabled=true; if(x.dataset.a===q.a) x.classList.add("right");});
    if(!ok) b.classList.add("wrong");
    const m=$("qMsg"); m.className="q-msg "+(ok?"right":"wrong"); m.innerHTML=ok?"Correct!":`Not quite. The answer is ${S(q.a)}.`;
    $("qNext").hidden=false; $("qNext").focus();
  });
  const nx=$("qNext"); if(nx) nx.onclick=()=>{quiz.i++;quiz.answered=false;renderLessonScreen();const qb=$("quizBox"); if(qb) qb.scrollIntoView({block:"nearest"});};
}

/* Lesson screen */
function renderLessonScreen(){
  const l=LESSONS[cur], isDone=done.has(cur), g=STAGES[l.stage];
  renderBar(`Lesson ${cur+1}`, `${l.min} min`);
  const hasA=l.letters.some((x,r)=>RECORDED.has(`l${cur}-${r}`));
  const rows=l.letters.map(([d,a,s,sp],r)=>`<tr class="${sp?"special":""}"><td class="d">${d}</td><td class="a">(${S(a)})</td><td class="s">${s}${sp?'<span class="badge">Sindhi only</span>':""}</td>${hasA?`<td class="h">${sayBtn(d,`l${cur}-${r}`)}</td>`:""}</tr>`).join("");
  const words=l.words.map(([d,a,m],k)=>`<div class="word"><span class="w-d">${markWord(d,cur)}</span><span class="w-a" id="wa-${k}" hidden>(${S(a)})</span><span class="w-m" id="wm-${k}" hidden>${m}</span><div class="w-actions">${sayBtn(d,`w${cur}-${k}`)}<button class="reveal" data-k="${k}">Show answer</button></div></div>`).join("");
  $("view").innerHTML=`
    <div class="rail" aria-label="Jump to a lesson">${LESSONS.map((x,i)=>`<button class="chip ${x.stage}${done.has(i)?" done":""}${i===cur?" on":""}" data-i="${i}" title="Lesson ${i+1}: ${x.title}" aria-label="Lesson ${i+1}: ${x.title}${done.has(i)?", done":""}">${done.has(i)?"✓":i+1}</button>`).join("")}</div>
    <article class="lesson">
      <div class="lesson-head ${l.stage}">
        <span class="eyebrow">Lesson ${cur+1} of ${LESSONS.length} · ${l.stage.toUpperCase()} · ${g.name}</span>
        <h2>${l.title}</h2>${TR(l.sd,l.dv)}
        <p class="hint">${l.hint}</p>
      </div>
      <div class="lesson-body">
        <div class="block"><h4>1 · THE LETTERS ${TR("اکر","अखर")}</h4>${hasA?`<p class="muted" style="font-size:.95rem">Tap the speaker to hear each letter.</p>`:""}<div class="tbl-wrap"><table><thead><tr><th>Devanagari</th><th>Arabic</th><th>Sound</th>${hasA?"<th>Hear</th>":""}</tr></thead><tbody>${rows}</tbody></table></div></div>
        <div class="block"><h4>2 · TWO TRICKS ${TR("ٽوٽڪا","टोटका")}</h4><ul class="tricks">${l.tricks.map(t=>`<li><span>${t}</span></li>`).join("")}</ul></div>
        ${l.words.length?`<div class="block"><h4>3 · READ IT ${TR("پڙهو","पढ़ो")}</h4>${l.words.some(w=>hasUnknown(w[0],cur))
          ?`<p class="muted" style="font-size:.95rem">Find this lesson's letter in <b class="g-hit">red</b>. <span class="g-dim">Grey parts</span> come in later lessons. Then tap to check.</p>`
          :`<p class="muted" style="font-size:.95rem">You know every part now. Try to read it first. Then tap to check.</p>`}<div class="words">${words}</div></div>`
          :`<div class="block"><h4>3 · MATCH IT ${TR("ملايو","मिलायो")}</h4><p class="muted" style="font-size:.95rem">You can't read whole words yet, so match the letters first. Real words start in lesson 6.</p><div class="match" id="matchBox"></div></div>`}
      </div>
      ${quizHTML()}
      <div class="lesson-foot">
        <button class="btn ${isDone?"soft":"primary"} big" id="markBtn">${isDone?"✓ Done · tap to undo":"Mark lesson done ✓"}</button>
        <div class="toolbar">
          <button class="tool" data-t="back" ${cur===0?"disabled":""}><span class="i">←</span>Back</button>
          <button class="tool" data-t="repeat"><span class="i">↺</span>Repeat</button>
          <button class="tool q" data-t="quiz"><span class="i">?</span>Quiz</button>
          <button class="tool" data-t="pause"><span class="i">❚❚</span>Pause</button>
          <button class="tool" data-t="next" ${cur===LESSONS.length-1?"disabled":""}><span class="i">→</span>Next</button>
        </div>
      </div>
    </article>`;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;quiz=null;save();renderLessonScreen();window.scrollTo(0,0);});
  document.querySelectorAll(".reveal").forEach(b=>b.onclick=()=>{const k=b.dataset.k;$(`wa-${k}`).hidden=false;$(`wm-${k}`).hidden=false;b.hidden=true;});
  document.querySelectorAll(".say").forEach(b=>b.onclick=()=>speak(b.dataset.id,b));
  renderMatch();
  $("markBtn").onclick=()=>{
    if(done.has(cur)){ done.delete(cur); save(); renderLessonScreen(); return; }
    done.add(cur); const was=cur; quiz=null;
    if(cur<LESSONS.length-1) cur++;
    save(); renderLessonScreen(); window.scrollTo(0,0);
    toast(done.size===LESSONS.length?"Course complete! Amazing work.":`Lesson ${was+1} done ✓  Next up: ${LESSONS[cur].title}`);
  };
  document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    if(t==="back"&&cur>0){cur--;quiz=null;save();renderLessonScreen();window.scrollTo(0,0);}
    else doCmd(t);
  });
  bindQuiz();
  renderNav();
}

function render(){
  renderNav();
  if(screen==="home") homeScreen();
  else if(screen==="tour-plan") tourPlan();
  else if(screen==="tour-mouth") tourMouth();
  else if(screen==="tour-extra") tourExtra();
  else if(screen==="outline") outlineScreen();
  else if(screen==="studio") studioScreen();
  else if(screen==="alphabet") alphabetScreen();
  else renderLessonScreen();
}
if(location.hash==="#studio") screen="studio";
window.addEventListener("hashchange",()=>{ if(location.hash==="#studio"){ stack=[]; studioLesson=null; screen="studio"; render(); } });
render();
</script>
<script>
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController && !reloaded){ reloaded=true; location.reload(); } });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
</html>
