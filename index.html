<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}

@font-face{font-family:"Noto Sans Devanagari";font-weight:400;font-display:swap;src:url(noto-sans-devanagari-devanagari-400-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Sans Devanagari";font-weight:600;font-display:swap;src:url(noto-sans-devanagari-devanagari-600-normal.woff2) format("woff2")}
@font-face{font-family:"Noto Sans Devanagari";font-weight:700;font-display:swap;src:url(noto-sans-devanagari-devanagari-700-normal.woff2) format("woff2")}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
/* Layout: app shell. Sticky top bar, one screen at a time, fixed bottom nav. Ajrak band as the brand mark. */
:root{
  --bg:#f1f5fc; --surface:#ffffff; --fg:#161a2e; --muted:#56607e; --line:#d4dff2; --blue:#2f6fd6; --blue-soft:#e8f0fd; --blue-wash:#dce8fb;
  --indigo:#23306e; --madder:#a8232d; --ochre:#b67a10; --ink:#0d1020; --good:#1f7a4a; --good-soft:#e2f3ea;
  --a-soft:#e6e9f7; --b-soft:#f8e5e6; --c-soft:#f8eedb;
  --special:#a8232d; --special-soft:#fbe9ea; --shadow:rgba(13,16,32,.12);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --dev:"Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif;
  --arab:"Noto Naskh Arabic", "Segoe UI", "Arial", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1222; --surface:#161d35; --fg:#e8eaf6; --muted:#a2acc8; --line:#28365a; --blue:#8db4ff; --blue-soft:#18233f; --blue-wash:#142041;
  --indigo:#9aa8ff; --madder:#ff8a8f; --ochre:#f0b850; --ink:#05060d; --good:#6fd6a0; --good-soft:#163527;
  --a-soft:#1f2650; --b-soft:#3a1c24; --c-soft:#36290f;
  --special:#ff8a8f; --special-soft:#3a1c24; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1222; --surface:#161d35; --fg:#e8eaf6; --muted:#a2acc8; --line:#28365a; --blue:#8db4ff; --blue-soft:#18233f; --blue-wash:#142041;
  --indigo:#9aa8ff; --madder:#ff8a8f; --ochre:#f0b850; --ink:#05060d; --good:#6fd6a0; --good-soft:#163527;
  --a-soft:#1f2650; --b-soft:#3a1c24; --c-soft:#36290f;
  --special:#ff8a8f; --special-soft:#3a1c24; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg) linear-gradient(180deg,var(--blue-wash) 0,var(--bg) 440px) no-repeat;color:var(--fg);font-family:var(--body);font-size:1.0625rem;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.dev{font-family:var(--dev)}
.ar{font-family:var(--arab);unicode-bidi:isolate}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tr{font-weight:400;color:var(--muted);white-space:nowrap}
.tr .ar{font-size:1.08em}
.tr{letter-spacing:0;text-transform:none}
.tr{white-space:normal}
.tr>bdi,.tr>.dev{white-space:nowrap}
.tr2{font-size:6.5px;font-weight:400;fill:var(--muted)}
.sv-ar{font-family:var(--arab)} .sv-dv{font-family:var(--dev)}
.intro-ex{display:flex;flex-direction:column;gap:6px}
.h1-tr{display:block;margin-top:6px;font-size:1.15rem}
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(5,6,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px var(--shadow)}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-x{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;font-size:1rem}
.sheet-pair{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--bg);border-radius:16px;padding:6px 10px}
.sheet-a{font-size:3.4rem;line-height:1.5;color:var(--madder)}
.sheet-d{font-family:var(--dev);font-size:3.4rem;font-weight:600;line-height:1.4}
.sheet-arrow{color:var(--muted);font-size:1.4rem}
.sheet-pair.small .sheet-a,.sheet-pair.small .sheet-d{font-size:2.2rem}
.sheet-say{display:flex;flex-direction:column;gap:2px;text-align:center}
.sheet-say b{font-size:1.15rem}
.sheet-say span{color:var(--muted)}
.sheet-ex{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.sheet-ex .sheet-pair{align-self:stretch}
.sheet-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.path{display:flex;column-gap:12px;row-gap:10px;flex-wrap:wrap;align-items:flex-start}
.path-seg{display:flex;flex-direction:column;gap:6px}
.path-dots{display:flex;gap:6px}
@media (max-width:560px){.path-seg:first-child{flex-basis:100%}}
.pdot{width:28px;height:28px;box-sizing:border-box;padding:0;border:2px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;font:700 .78rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pdot:hover{border-color:var(--blue)}
.pdot.a.done{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.pdot.b.done{background:var(--madder);border-color:var(--madder);color:var(--surface)}
.pdot.c.done{background:var(--ochre);border-color:var(--ochre);color:var(--surface)}
.pdot.cur{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 3px var(--a-soft);animation:breathe 2.4s ease-in-out infinite}
.path-lbl{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;text-underline-offset:3px}
.path-lbl:hover{text-decoration:underline}
.stage-def{margin:2px 0;font-size:.95rem}
.stage-def .ar{font-size:1.1rem} .stage-def .dev{font-size:1.05rem}
details.def{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.95rem}
details.def summary{cursor:pointer;font-weight:700;color:var(--indigo)}
details.def p{margin:6px 0 2px}
details.def .ar{font-size:1.1rem} details.def .dev{font-size:1.05rem}
.ex-pic{font-size:3.2rem;line-height:1.1}
.ex-pic .topi{width:110px;height:auto;display:block}
.w-pic{font-size:1.6rem;vertical-align:middle}
.intro-ex .pair{background:var(--blue-soft);border-radius:18px;padding:10px 20px;align-self:flex-start}
.tour-item{background:var(--blue-soft)!important}
.recipe div{background:var(--blue-soft)!important}
.sheet-pair{background:var(--blue-soft)!important}
.match{background:var(--blue-soft)!important}
.block h4{color:var(--blue)!important}
thead th{background:var(--blue-soft);color:var(--blue)}
tbody tr:nth-child(even):not(.special) td{background:var(--bg)}
.abc-t{background:var(--surface);border-radius:14px;overflow:hidden}
.abc-t tr.go:hover td{background:var(--blue-soft)!important}
.appbar{box-shadow:0 1px 0 var(--line),0 4px 14px var(--blue-wash)!important}
.greet{margin:0;font-weight:700;color:var(--blue);font-size:1.05rem}
.greet-tr .tr{color:var(--muted)}
.lotd{text-align:left;cursor:pointer;width:100%}
.lotd:hover{border-color:var(--blue)}
.lotd-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lotd-pair{display:flex;align-items:center;gap:10px;background:var(--blue-soft);border-radius:16px;padding:2px 16px}
.lotd-pair .sheet-a,.lotd-pair .sheet-d{font-size:2.6rem}
.lotd-ex{display:flex;flex-direction:column;gap:2px;min-width:0}
.lotd-ex .ar{font-size:1.4rem} .lotd-ex .dev{font-size:1.3rem}
.lotd-pic{font-size:2rem;line-height:1.2}
.lotd-pic .topi{width:64px;height:auto;display:block}
.lotd .cue{color:var(--blue);font-weight:700}
.sheet-back.mid{align-items:center;padding:16px}
.celebrate{border-radius:22px;text-align:center;align-items:center}
.celebrate .path{justify-content:center}
.celebrate .path-seg{align-items:center}
/* Wayfinding: part pills, on-this-page index, sections, part shortcuts, you-are-here, bottom-bar map */
.part-pill{display:inline-block;font-family:var(--display);font-weight:800;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:var(--surface);line-height:1.2;white-space:nowrap}
.part-pill.a{background:var(--indigo)} .part-pill.b{background:var(--madder)} .part-pill.c{background:var(--ochre)}
.onpage{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.onpage .op-t{grid-column:1/-1;font-size:.82rem;font-weight:700;color:var(--muted);padding-left:2px}
.onpage button{border:1px solid var(--line);background:var(--blue-soft);color:var(--fg);font-weight:700;font-size:.86rem;line-height:1.25;padding:9px 6px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;min-width:0}
.onpage button:hover{border-color:var(--blue)}
.onpage button span{color:var(--blue);margin-left:2px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:84px}
.sec + .sec{border-top:1px solid var(--line);padding-top:22px}
.sec-lead{margin:0}
.stage .why-line{margin:0;font-size:.92rem;color:var(--muted)}
.sp .see-part{align-self:center;margin-top:4px}
.see-part{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--indigo);font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit}
.demo-step{display:flex;flex-direction:column;gap:6px;background:var(--blue-soft);border-radius:14px;padding:12px}
.demo-step .stepper span{height:22px;display:flex;align-items:center}
.demo-step .stepper span::after{content:"";display:block;width:100%;height:8px;border-radius:99px;background:var(--line)}
.demo-step .stepper span.on::after{background:var(--blue)}
.part-jump{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.part-jump button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface);cursor:pointer;color:var(--fg);min-width:0;font-family:inherit}
.part-jump button:hover{border-color:var(--blue)}
.part-jump button.cur{border:2px solid var(--fg);padding:9px}
.part-jump .here{letter-spacing:0;text-transform:none;font-size:.78rem;white-space:nowrap;margin:2px 0 0}
.part-jump .here::before{display:none}
.part-jump .pj-n{font-weight:700;font-size:.95rem;line-height:1.2}
.part-jump small{color:var(--muted);font-size:.78rem;line-height:1.3}
.ol-end{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:18px;border-top:1px solid var(--line)}
.ol-end p{margin:0}
.ol-stage .part-pill{align-self:flex-start;margin-bottom:4px}
.here{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.here::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
.find-map{display:flex;flex-direction:column;gap:8px}
.find-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.find-row .ic{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;font-size:.78rem;font-weight:700;color:var(--indigo)}
.find-row .ic .pill{padding:3px 12px;border-radius:99px;background:var(--a-soft);display:grid;place-items:center}
.find-row .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.find-row .ic .nsub .ar{font-size:.85rem} .find-row .ic .nsub .dev{font-size:.72rem}
.find-row p{margin:0;font-size:.95rem}
.cel-check{width:84px;height:84px;border-radius:50%;background:var(--blue);color:var(--surface);display:grid;place-items:center;font-size:2.6rem;font-weight:800;animation:popin .55s cubic-bezier(.2,1.5,.4,1) both}
.cel-chips{justify-content:center}
.celebrate .btn.big{width:100%}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes breathe{50%{box-shadow:0 0 0 5px var(--blue-soft)}}
.view.enter > *{animation:rise .35s ease both}
.view.enter > *:nth-child(2){animation-delay:.05s} .view.enter > *:nth-child(3){animation-delay:.1s} .view.enter > *:nth-child(4){animation-delay:.15s} .view.enter > *:nth-child(n+5){animation-delay:.2s}
.sheet{animation:slideup .3s ease both}
.q-opt.right,.m-opt.right{animation:pop .35s ease}
.q-opt.wrong,.m-opt.wrong{animation:shake .3s ease}
.misaal{display:block;margin-top:6px}
.misaal .tr{font-size:.92em}
.stage .ex .misaal{margin-top:0}
.stage .ex small{display:block;margin-top:4px}
.kid-wrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 6px 2px}
.kid-art{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.recipe .tr,.cmd .tr,.tour-item .tr{font-size:.85rem;margin-top:-2px}
.cmd .tr{color:var(--muted)}
.frog-btn{background:none;border:0;padding:0;cursor:pointer;flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.frog-btn .frog{width:32px;height:auto;display:block}
.frog-btn.small{width:26px;height:26px}
.frog-btn.small .frog{width:20px}
.frog-btn.hop .frog{animation:hop .6s ease}
.cel-frog{width:96px;height:96px}
.cel-frog .frog{width:84px;animation:hop 1.2s ease-in-out .3s 2}
a.btn{display:block;text-decoration:none;color:inherit}
.foot-name{margin:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.8rem;color:var(--muted)}
@keyframes hop{0%{transform:none}30%{transform:translateY(-9px) rotate(-8deg)}55%{transform:none}72%{transform:translateY(-3px)}100%{transform:none}}
/* Text size and calm mode */
:root[data-size="l"]{font-size:18px} :root[data-size="xl"]{font-size:20px}
:root.calm *,:root.calm *::after{animation:none!important;transition:none!important}
/* Welcome: one action, no tabs */
body.first .nav{display:none}
.welcome{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.welcome .skip{margin-top:-4px}
.home-top{display:flex;flex-direction:column;gap:8px}
.purpose{margin:0;color:var(--muted)}
.days{margin:0;font-size:.92rem;color:var(--muted)}
.gear{height:40px;width:40px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.gear svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Focus mode */
.lesson-steps{padding:14px 18px 0;display:flex;flex-direction:column;gap:4px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st-seg{height:22px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center}
.st-seg::after{content:"";display:block;width:100%;height:8px;border-radius:99px;background:var(--line)}
.st-seg.past::after{background:var(--blue);opacity:.45}
.st-seg.on::after{background:var(--blue)}
.st-label{font-size:.9rem;color:var(--muted)}
.step-nav{display:flex;gap:10px;padding:0 18px 18px}
.step-nav .btn.primary{flex:1}
.step-tip{font-size:.92rem;margin:0}
.done-step{text-align:center;align-items:center}
.done-step .btn.big{width:100%}
.toolbar{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.break-note{margin:0;background:var(--good-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
/* Review */
.review-box{border-radius:18px;border:1px solid var(--line)}
.q-opt.dev-opt{font-family:var(--dev);font-weight:600}
/* Settings */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg-b{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:700;font-size:.85rem;min-width:0}
.seg-b.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.set-row h3{margin-bottom:2px}
.switch{width:54px;height:32px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch.on{background:var(--blue)}
.switch.on span{left:26px}
/* Letter writing animation */
.write-box{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--blue-soft);border-radius:16px;padding:8px 10px 12px}
.write-pair{display:flex;align-items:center;justify-content:center;gap:10px}
.write{width:112px;height:112px;display:block}
.write.ar{color:var(--madder)} .write.dv{color:var(--fg)}
.write text{fill:transparent;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:trace 1.5s ease-in-out forwards,inkfill .5s ease 1.35s forwards}
.write.dv text{animation-delay:1.9s,3.25s}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes inkfill{to{fill:currentColor;stroke-width:0}}
:root.calm .write text{fill:currentColor;stroke-width:0;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.write text{fill:currentColor;stroke-width:0;stroke-dashoffset:0}}
.write-tips{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.86rem;color:var(--muted);text-align:center}
.write-none{width:112px;text-align:center}
/* Reading helper */
.rd-in{width:100%;font-family:var(--dev);font-size:1.35rem;line-height:1.6;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
.rd-in:focus{outline:none;border-color:var(--blue)}
.rd-opt{font-size:.95rem}
.rd-note{font-size:.88rem;margin:0}
.rd-ar{margin:0;font-family:var(--arab);font-size:1.7rem;line-height:2;text-align:right}
.rd-words{display:flex;flex-wrap:wrap;gap:8px}
.rd-w{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;cursor:pointer}
.rd-w .dev{font-size:1.25rem;font-weight:600}
.rd-w .ar{font-size:1.25rem;color:var(--madder)}
.rd-w.on{border-color:var(--blue);background:var(--blue-soft)}
.rd-parts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rd-p{display:flex;align-items:center;gap:6px;background:var(--blue-soft);border-radius:10px;padding:4px 10px}
.rd-p .dev{font-size:1.4rem;font-weight:600}
.rd-p .ar{font-size:1.4rem;color:var(--madder)}
.tool-card{text-align:left;cursor:pointer;width:100%}
.tool-card .cue{color:var(--blue);font-weight:700}
.home-link{background:none;border:0;padding:4px;color:var(--muted);cursor:pointer;text-align:center;font-size:.95rem}
.home-link b{color:var(--blue)}
.lesson-mouth{display:flex;align-items:center;gap:14px;background:var(--blue-soft);border-radius:16px;padding:10px 12px;flex-wrap:wrap}
.lesson-mouth svg{width:130px;height:auto;flex:none}
.lm-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 160px}
.lm-txt span{font-size:.98rem}
.lm-txt small{font-size:.86rem}
.lm-link{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Guide: step bar on top, floating next bar */
.tour-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ts{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.82rem;text-align:center;min-width:0}
.ts-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-size:.9rem}
.ts.past .ts-n{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.ts.on{color:var(--blue)}
.ts-sub{margin-top:0}
.ts-sub .ar{font-size:.9rem} .ts-sub .dev{font-size:.74rem}
.ts.on .ts-n{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.tour-next{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px var(--shadow)}
.tour-next .btn.primary{flex:1}
.tour-next .btn:not(.primary){flex:0 0 auto}
.tour-next{gap:8px;padding:10px}
.tour-next .btn{padding-inline:12px}
@media (max-width:380px){.tour-next .btn{font-size:.94rem;padding-inline:10px}}
.tn-page{font-size:.9rem;color:var(--muted);white-space:nowrap}
/* Tap feel */
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.m-opt,.q-opt,.pdot,.st-seg,.ts,.rd-w,.tool,.chip,.abc-t tr{-webkit-user-select:none;user-select:none}
.btn,.q-opt,.m-opt,.tool,.cmd,.fact,.tour-item,.ol-row,.rd-w,.seg-b{transition:transform .08s ease}
.btn:active,.q-opt:active:not(:disabled),.m-opt:active:not(:disabled),.tool:active,.cmd:active,.tour-item:active,.ol-row:active,.rd-w:active,.seg-b:active{transform:scale(.97)}
.abc-tip{margin:0;color:var(--muted)}
.abc-help .steps{margin-top:8px}
.badge{white-space:nowrap}
td.s .badge{display:inline-block;margin:4px 0 0;text-transform:none;letter-spacing:0;font-size:.78rem;max-width:100%}
.celebrate .prog-meta{align-self:stretch;gap:12px}
.write-box .reveal{align-self:center}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"Show ▾";font-size:.85rem;font-weight:700;color:var(--blue);white-space:nowrap}
details.fold[open] summary::after{content:"Hide ▴"}
details.fold summary h3{margin:0}
.lesson-mouth{flex-wrap:nowrap!important}
.lesson-mouth svg{width:92px!important}
/* Profiles */
.who-list{display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.who:hover{border-color:var(--blue)}
.who .go{margin-left:auto;color:var(--blue);font-weight:700;white-space:nowrap;padding-left:8px}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t b{font-size:1.1rem}
.who-t small{color:var(--muted)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:#e8f0fd;border:2px solid var(--line)}
.av svg{width:80%;height:auto;display:block;margin-top:2px}

.who-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.who-row:first-child{border-top:0;padding-top:0}
.who-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.85rem;font-weight:700;cursor:pointer}
.add-form{display:flex;flex-direction:column;gap:8px;width:100%}
.add-form label{font-weight:700;font-size:.92rem}
.name-in{font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.name-in:focus{outline:none;border-color:var(--blue)}
.switch-link{align-self:flex-start;background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bar-demo{display:flex;flex-direction:column;gap:8px;background:var(--blue-soft);border-radius:14px;padding:10px}
.bar-demo .tool{cursor:default}
.bar-caps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:.8rem;line-height:1.3}
.bar-caps > span{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bar-caps .tr{white-space:normal;font-size:.72rem;display:block}
details.fold summary > div{display:flex;flex-direction:column}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 5px;border-radius:99px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;color:var(--fg);max-width:46%;min-width:0}
.me-chip:hover{border-color:var(--blue)}
.me-chip .av{width:30px;height:30px;border-width:1px}
.me-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.me-chip .chev{color:var(--muted);font-size:.8rem}
.appbar-in .gear{margin-left:0}
@media (max-width:380px){.appbar-in:has(.me-chip) .appbar-title{display:none}.me-chip{max-width:62%}}
.who.now{border-color:var(--blue);background:var(--blue-soft)}
.who.now .go{color:var(--blue)}
/* Sindhi under every key button, so learners who don't read English can follow */
.btn .sub{display:block;font-size:.78rem;font-weight:400;opacity:.9;margin-top:2px;line-height:1.35}
.btn .sub .ar{font-size:1.02rem}
.reveal .sub{display:inline;margin-left:6px;font-weight:400;font-size:.82rem}
.tsub{display:block;font-size:.66rem;font-weight:400;line-height:1.25;opacity:.85;margin-top:1px;white-space:nowrap}
.tsub .ar{font-size:.78rem}
.nav .tsub{font-size:.6rem}
.nav .tsub .ar{font-size:.72rem}
.eyebrow .tr{font-size:.95rem}
.q-ask .tr{font-weight:400}
.m-top .tr{font-weight:400}
.m-top{gap:10px;align-items:flex-start}
.m-top > span:last-child{white-space:nowrap}
.badge{padding:3px 10px!important;line-height:1.4}
/* Breathing room for the two scripts */
.tr{line-height:1.75}
.tr .sep{margin:0 .45em;opacity:.7}
.tr .ar{font-size:1.14em}
.lt{display:flex;flex-direction:column;align-items:flex-start;color:var(--muted);line-height:1.55;margin-top:4px;gap:1px}
.lt .ar{font-size:1.22rem}
.lt .dev{font-size:1.04rem}
.lesson-head .lt .ar{font-size:1.3rem}
.lesson-head .lt .dev{font-size:1.1rem}
.ol-txt .lt{margin-top:0}
.ol-txt .lt .ar{font-size:1.12rem}
.ol-txt .lt .dev{font-size:.98rem}
/* The Sindhi title is part of the title: its own soft box, brighter text */
.lt{background:var(--blue-soft);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--fg)!important;align-self:flex-start;max-width:100%}
.lt .ar,.lt .dev{opacity:.92}
.lesson-head .lt{background:var(--surface);margin-top:6px}
.ol-txt .lt{background:none;border:0;padding:0;color:var(--muted)!important}
/* Extra info looks like extra info: small chips */
.next-up{gap:6px!important}
.next-up > b{font-size:1.3rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.mchip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mchip.on{color:var(--blue);border-color:var(--blue)}
/* Bottom bar Sindhi: two lines, larger, bolder, full strength */
.nav button{gap:1px!important;padding:7px 2px 8px!important;line-height:1.15}
.nsub{display:flex;flex-direction:column;align-items:center;line-height:1.25;margin-top:1px}
.nsub .ar{font-size:.95rem;font-weight:600;line-height:1.45}
.nsub .dev{font-size:.76rem;font-weight:600}
/* Lesson buttons: same treatment */
.tsub{opacity:1!important;font-size:.72rem!important}
.tsub .ar{font-size:.88rem!important;font-weight:600}
.tsub .dev{font-weight:600}
.tour-next{bottom:calc(var(--nav-h,78px) + 8px)!important}
.toast{bottom:calc(var(--nav-h,78px) + 12px)!important}
.view{padding-bottom:calc(var(--nav-h,78px) + 48px)!important}
.who .av{width:54px;height:54px}
.who .av svg{width:84%}
.tp-label{font-weight:700;font-size:.92rem}
.tp-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tp{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#e8f0fd;cursor:pointer;display:grid;place-items:center;padding:4px;min-width:0}
.tp svg{width:100%;height:auto}
.tp.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.ex-pic .topi{width:150px!important}
/* Readability pass */
.q-opt{font-size:2.5rem!important;line-height:1.7!important}
.q-opt.dev-opt{font-size:2.1rem!important;line-height:1.5!important}
p .ar,li .ar,.hint .ar,.lm-txt .ar{font-size:1.15em}
.tricks .ar{font-size:1.2rem!important}
.abc-t td.a{width:24%}
.abc-t td.d{width:28%}
.abc-t td.say-it small{font-size:.86rem}
.abc-t td.say-it small .ar{font-size:1.1em}
.abc-les{display:inline-block;margin-top:3px;font-size:.78rem;font-weight:700;color:var(--blue)}
.skip{background:none;border:0;padding:6px;color:var(--indigo);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center}
ol.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
ol.steps li{padding-left:2px}
.abc-t td{padding:6px 8px}
.abc-t td.n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;width:1%}
.abc-t td.a{font-size:1.7rem;width:auto;color:var(--madder);text-align:center}
.abc-t td.d{font-size:1.7rem;width:auto;text-align:center}
.abc-t td.say-it{font-size:.92rem}
.abc-t td.say-it b{display:block;font-size:1.05rem}
.abc-t td.say-it small{color:var(--muted);line-height:1.3;display:block}
.abc-t td.l{text-align:center;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums}
.abc-t tr.go{cursor:pointer}
.abc-t tr.go:hover td{background:var(--a-soft)}
.abc-t tr.same td.d{color:var(--muted)}
.marks{display:flex;flex-direction:column;gap:8px}
.mark{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mark-pair{display:flex;align-items:center;gap:8px;flex:none;min-width:120px}
.mark-a{font-size:1.7rem;color:var(--madder)}
.mark-arrow{color:var(--muted)}
.mark-d{font-family:var(--dev);font-size:1.7rem;font-weight:600}
.mark-txt{min-width:0;font-size:.95rem}
.mark-txt p{margin:2px 0 0;color:var(--muted)}
.mark-txt .ar{font-size:1.1rem}
.abc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.abc{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;position:relative;min-width:0}
.abc:hover:not(:disabled){border-color:var(--indigo)}
.abc:disabled{cursor:default;opacity:.7}
.abc-n{position:absolute;top:4px;left:7px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.abc-a{font-family:var(--arab);font-size:1.9rem;line-height:1.5;color:var(--madder)}
.abc-d{font-family:var(--dev);font-size:1.7rem;font-weight:600;line-height:1.3}
.abc-l{font-size:.72rem;color:var(--muted);white-space:nowrap}
.abc-l .ar{font-size:.95rem}
.abc.sp{background:var(--special-soft);border-color:var(--special)}
.abc.same .abc-d{color:var(--muted)}

/* Shell */
.band{height:14px;background-color:var(--indigo);
  background-image:radial-gradient(circle at 50% 50%, var(--madder) 0 3px, transparent 3.5px),
    conic-gradient(from 45deg at 50% 50%, var(--ink) 0 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0);
  background-size:14px 14px,14px 14px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.appbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.back{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);cursor:pointer;font-size:1.2rem;flex:none}
.appbar-title{font-family:var(--display);font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar-step{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap}
.view{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;cursor:pointer;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center}
.nav button.on{color:var(--indigo)}
.nav button.on .pill{background:var(--a-soft)}

/* Cards and buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{font-weight:700;border-radius:14px;padding:12px 18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--surface)}
.btn.big{font-size:1.08rem;padding:14px 18px;width:100%}
.btn.soft{background:var(--a-soft);border-color:transparent;color:var(--indigo)}
.btn.quizb{border-color:var(--ochre);background:var(--c-soft)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* Home */
.pair{display:flex;align-items:center;gap:12px}
.pair .big{font-family:var(--dev);font-size:3.6rem;line-height:1;color:var(--indigo);font-weight:600}
.pair .big-ar{font-family:var(--arab);font-size:2.9rem;line-height:1;color:var(--madder)}
.pair .eq{font-size:1.4rem;color:var(--muted)}
.lede{font-size:1.08rem;color:var(--muted);max-width:52ch}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--madder),var(--ochre));transition:width .4s ease}
.prog-meta{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.next-up{display:flex;flex-direction:column;gap:4px}
.next-up b{font-family:var(--display);font-size:1.3rem}
.tour-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tour-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:0;border-radius:14px;padding:12px;cursor:pointer}
.tour-item .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--indigo);color:var(--indigo);flex:none}
.tour-item.seen .n{background:var(--indigo);color:var(--surface)}
.tour-item .t{display:flex;flex-direction:column;min-width:0}
.tour-item .t small{color:var(--muted)}
.tour-item .go{margin-left:auto;color:var(--indigo);font-weight:700}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.fact:hover{border-color:var(--indigo)}
.fact b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.fact span{font-size:.85rem;color:var(--muted)}
.fact .cue{color:var(--indigo);font-weight:700;margin-top:4px}
@media (max-width:480px){.facts{grid-template-columns:1fr}}
.paused{background:var(--good-soft);border:2px solid var(--good);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.paused b{font-family:var(--display);font-size:1.15rem}

/* Tour */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--indigo);width:26px;border-radius:99px}
.stages{display:flex;flex-direction:column;gap:10px}
.stage{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.stage.a{background:var(--a-soft)} .stage.b{background:var(--b-soft)} .stage.c{background:var(--c-soft)}
.stage .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage .tag{font-family:var(--display);font-weight:800;font-size:1.6rem}
.a-c{color:var(--indigo)} .b-c{color:var(--madder)} .c-c{color:var(--ochre)}
.stage .name{font-weight:700;font-size:1.08rem}
.stage small{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.stage .ex{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:.95rem}
.stage .ex .dev{font-size:1.3rem}
.stage .ex .ar{font-size:1.2rem}
.split{display:flex;height:44px;border-radius:12px;overflow:hidden;font-weight:700;font-size:.85rem}
.split div{display:grid;place-items:center;color:var(--surface);min-width:0}
.split .a{background:var(--indigo)} .split .b{background:var(--madder)} .split .c{background:var(--ochre)}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.why li{display:flex;gap:10px}
.why li b.k{font-family:var(--display);flex:none;width:1.4em}
.recipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;counter-reset:r}
.recipe div{background:var(--bg);border-radius:12px;padding:12px;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.recipe div::before{counter-increment:r;content:counter(r);font-family:var(--display);font-weight:800;color:var(--madder);font-size:1.3rem}
@media (max-width:560px){.recipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cmds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:2px solid var(--indigo);border-radius:14px;padding:12px;cursor:pointer;text-align:left}

.ring{fill:none;stroke:var(--ochre);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}

.st{display:flex;align-items:center;gap:14px;padding-block:12px;border-top:1px solid var(--line)}

.st .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st .ltr{font-family:var(--dev);font-size:1.6rem;font-weight:600;line-height:1.2}
.st .ltr .ar{font-size:1.3rem;color:var(--madder);font-weight:400}
.st small{font-size:.9rem;color:var(--muted)}
.st .go{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--indigo);font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.arrow{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Specials */
.specials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.sp .arr{font-size:.85rem;color:var(--muted)}

.ol-row.c.done .ol-num{background:var(--ochre);border-color:var(--ochre)}

.ol-txt{display:flex;flex-direction:column;gap:6px;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:4px 6px}

.ol-min{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:6px}

.chip.a.done{background:var(--indigo);border-color:var(--indigo)}
.chip.b.done{background:var(--madder);border-color:var(--madder)}
.chip.c.done{background:var(--ochre);border-color:var(--ochre)}
.chip.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

.lesson-head .tr{font-size:1.05rem;white-space:normal}
.lesson-head .hint{color:var(--muted);font-size:.98rem}
.lesson-body{padding:18px;display:flex;flex-direction:column;gap:22px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}

td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

.block{display:flex;flex-direction:column;gap:10px}
.block h4{margin:0;font-family:var(--display);font-size:1rem;font-weight:800;color:var(--muted);letter-spacing:.04em}

.g-hit{color:var(--madder)}
.match{background:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}

.m-done b{font-family:var(--display);font-size:1.3rem;color:var(--good)}
.g-dim{opacity:.28}
.rec-item{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-item.has{border-color:var(--good);background:var(--good-soft)}
.rec-text{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.rec-d{font-family:var(--dev);font-size:2rem;font-weight:600;line-height:1.3}
.rec-a .ar{font-size:1.4rem;color:var(--madder)}
.rec-text small{color:var(--muted);font-size:.9rem}
.rec-btns{display:flex;gap:8px;flex-wrap:wrap}
.recb{border:2px solid var(--madder);color:var(--madder);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;min-width:112px}
.recb.on{background:var(--madder);color:var(--surface);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
.playb{border:2px solid var(--indigo);color:var(--indigo);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}
td.h{width:56px;text-align:center}
.w-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-prompt .say{margin-top:6px}
.reveal{font-size:.95rem;font-weight:700;align-self:flex-start;background:var(--a-soft);border:0;border-radius:10px;padding:6px 12px;color:var(--indigo);cursor:pointer}
.lesson-foot{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tool{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.8rem;font-weight:700;min-width:0}
.tool .i{font-size:1.15rem;line-height:1.3}
.tool:disabled{opacity:.35;cursor:default}
.tool.q{border-color:var(--ochre);background:var(--c-soft)}

/* Quiz */
.quiz{border-top:3px solid var(--ochre);background:var(--c-soft);padding:18px;display:flex;flex-direction:column;gap:14px}
.quiz-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.quiz-top > div{display:flex;flex-direction:column}
.quiz-top b{font-family:var(--display);font-size:1.15rem}
.quiz-top .mchip{font-variant-numeric:tabular-nums;white-space:nowrap}
.q-prompt{font-family:var(--dev);font-size:3.2rem;font-weight:600;line-height:1.2;text-align:center;background:var(--surface);border-radius:14px;padding:10px}
.q-ask{text-align:center;font-weight:700}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.q-opt{font-family:var(--arab);font-size:1.8rem;line-height:1.5;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;min-width:0}
.q-opt:hover:not(:disabled){border-color:var(--indigo)}
.q-opt.right{border-color:var(--good);background:var(--good-soft)}
.q-opt.wrong{border-color:var(--madder);background:var(--special-soft)}
.q-opt:disabled{cursor:default}
.q-msg{text-align:center;font-weight:700;min-height:1.5em}
.q-msg.right{color:var(--good)} .q-msg.wrong{color:var(--madder)}
.q-end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.q-end .score{font-family:var(--display);font-size:2.4rem;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow);z-index:10;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Swipe left or right to change guide page. Ignores the screen edges (phone back gesture) and mostly-vertical scrolls. Never starts a lesson. */
(function(){ let sx=0,sy=0,st=0,armed=false; const v=document.getElementById("view"); if(!v) return;
  v.addEventListener("touchstart",e=>{ armed=false; if(!screen.startsWith("tour-")||e.touches.length!==1) return; const t=e.touches[0]; if(t.clientX<28||t.clientX>innerWidth-28) return; sx=t.clientX; sy=t.clientY; st=Date.now(); armed=true; },{passive:true});
  v.addEventListener("touchend",e=>{ if(!armed||!screen.startsWith("tour-")) return; armed=false; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8) return;
    const i=TOUR.findIndex(x=>"tour-"+x.k===screen); if(i<0) return; if(dx<0) tourNextGo(i); else tourBackGo(i); },{passive:true});
})();

/* Letter card: slides up when a letter is tapped in the alphabet list. */
function openLetter(i){
  const [a,d,l,same,rom,how]=ABC[i], [ea,ed,em]=EX[i], sp=/[ٻڄڏڳ]/.test(a);
  closeLetter();
  const back=document.createElement("div"); back.className="sheet-back"; back.id="sheetBack";
  back.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Letter ${i+1}: ${a} is ${d}">
    <div class="sheet-top"><span class="eyebrow">Letter ${i+1} of ${ABC.length}${sp?' · <span class="badge" style="margin:0">Sindhi only</span>':""}</span><button class="sheet-x" id="sheetX" aria-label="Close">✕</button></div>
    <div class="write-box" role="img" aria-label="${a} is written ${d} in Devanagari">
      <div class="write-pair" id="writePair">${writeSVG(a,"ar")}<span class="sheet-arrow">→</span>${d==="–"?`<span class="muted write-none">no letter</span>`:writeSVG(d,"dv")}</div>
      <div class="write-tips"><span><b>Arabic:</b> right to left, dots last</span><span><b>Devanagari:</b> letter first, top line last</span></div>
      <button class="reveal" id="rewrite">↺ Write it again</button>
    </div>
    <div class="sheet-say"><b>Say it: ${rom}</b><span>${ARW(how)}</span>${same?`<span>Devanagari uses ${D(d)} for ${S(same)} and ${S(a)} alike.</span>`:""}</div>
    <div class="sheet-ex"><span class="eyebrow">Example word ${TR(...SD.example)}</span>
      ${PIC[i]?`<div class="ex-pic" aria-hidden="true">${PIC[i]}</div>`:""}
      <div class="sheet-pair small"><span class="sheet-a">${S(ea)}</span><span class="sheet-arrow">→</span><span class="sheet-d">${ed}</span></div>
      <span class="muted">means "${em}"</span></div>
    ${l?`<button class="btn primary big" id="sheetLesson">Open lesson ${l} →${SUB("open")}</button>`:`<p class="muted">Devanagari has <b>no letter</b> for this. It just writes the vowel, like ${S("جاءِ")} → ${D("जाइ")}.</p>`}
    <div class="sheet-nav"><button class="btn" id="sheetPrev" ${i===0?"disabled":""}>← Previous${SUB("back")}</button><button class="btn" id="sheetNext" ${i===ABC.length-1?"disabled":""}>Next →${SUB("next")}</button></div>
  </div>`;
  document.body.appendChild(back);
  back.onclick=e=>{ if(e.target===back) closeLetter(); };
  $("sheetX").onclick=closeLetter;
  $("rewrite").onclick=()=>{ const wp=$("writePair"); wp.innerHTML=wp.innerHTML; };
  $("sheetPrev").onclick=()=>openLetter(i-1);
  $("sheetNext").onclick=()=>openLetter(i+1);
  const sl=$("sheetLesson"); if(sl) sl.onclick=()=>{ closeLetter(); openLesson(l-1); };
  $("sheetX").focus();
}
function writeSVG(g,kind){
  const ar=kind==="ar", long=[...g].length>2, size=ar?(long?54:80):(long?40:72);
  return `<svg class="write ${kind}" viewBox="0 0 120 120" aria-hidden="true"><text x="60" y="${ar?82:84}" text-anchor="middle" font-family="${ar?"Noto Naskh Arabic, serif":"Noto Sans Devanagari, sans-serif"}" font-size="${size}"${ar?' direction="rtl"':' font-weight="600"'}>${g}</text></svg>`;
}
function closeLetter(){ const b=$("sheetBack"); if(!b) return; const after=b.dataset.after; b.remove(); if(after==="lesson") openLesson(cur); }
function celebrate(was){
  closeLetter();
  const l=LESSONS[was], all=done.size===LESSONS.length, next=cur!==was?cur:null;
  const back=document.createElement("div"); back.className="sheet-back mid"; back.id="sheetBack"; back.dataset.after="lesson";
  back.innerHTML=`<div class="sheet celebrate" role="dialog" aria-modal="true" aria-label="Lesson ${was+1} done">
    ${all?`<button class="frog-btn cel-frog" aria-label="Dedar means frog. Tap me.">${FROG}</button>`:`<div class="cel-check" aria-hidden="true">✓</div>`}
    <div><h2>${all?"Course complete!":`Lesson ${was+1} done!`}</h2>${all?TR("شاباس! سَڄو ڪورس پورو","शाबास! सॼो कोर्स पूरो"):TR(`شاباس! سَبَق ${was+1} پورو`,`शाबास! सबक़ ${was+1} पूरो`)}</div>
    <p class="muted">${all?"You can now read Sindhi in Devanagari. Amazing work.":"You just learned these:"}</p>
    ${all?"":`<div class="chips cel-chips">${l.letters.map(x=>`<span class="lc">${LONE(x[0])} ${S("("+x[1]+")")}</span>`).join("")}</div>`}
    ${sessionDone>=2&&!all?`<p class="break-note">That's <b>${sessionDone} lessons in a row</b>. Great focus! A short break now helps the letters stick.</p>`:""}
    ${pathHTML()}
    ${next!==null?`<button class="btn primary big" id="celNext">Next: lesson ${next+1} →${SUB("next")}</button>`:""}
    ${sessionDone>=2&&!all?`<button class="btn big" id="celBreak">Take a break${SUB("pause")}</button>`:""}
    <button class="btn big" id="celHome">Back to home${SUB("home")}</button>
  </div>`;
  document.body.appendChild(back);
  bindPath(back); bindFrogs(back);
  const n=$("celNext"); if(n){ n.onclick=closeLetter; n.focus(); }
  $("celHome").onclick=()=>{ back.dataset.after=""; closeLetter(); stack=[]; show("home",false); };
  const cb=$("celBreak"); if(cb) cb.onclick=()=>{ back.dataset.after=""; closeLetter(); stack=[]; pausedMsg="break"; screen="home"; render(); window.scrollTo(0,0); };
}

/* Commands */
function doCmd(c){
  if(c==="next"){ if(cur<LESSONS.length-1){ openLesson(cur+1); toast(`Lesson ${cur+1}: ${LESSONS[cur].title}`);} else toast("This is the last lesson. Well done!"); }
  else if(c==="quiz"){ if(screen!=="lesson") show("lesson"); startQuiz(); }
  else if(c==="repeat"){ step=0; match=null; quiz=null; save(); openLesson(cur); toast(`Starting lesson ${cur+1} again`); }

}

/* What the learner knows by each lesson: every character taught in that lesson or earlier. */
const KNOWN = LESSONS.map((_,i)=>{ const s=new Set(); for(let j=0;j<=i;j++) LESSONS[j].letters.forEach(x=>[...x[0]].forEach(c=>s.add(c))); return s; });
const NEW = LESSONS.map((l,i)=>new Set(l.letters.flatMap(x=>[...x[0]]).filter(c=>i===0 || !KNOWN[i-1].has(c))));
const SEG = (typeof Intl!=="undefined" && Intl.Segmenter) ? new Intl.Segmenter("hi",{granularity:"grapheme"}) : null;
const graphemes = t => SEG ? [...SEG.segment(t)].map(x=>x.segment) : [...t];
const hasUnknown = (t,i) => [...t].some(c=>c!==" " && !KNOWN[i].has(c));
function markWord(t,i){
  return graphemes(t).map(g=>{
    if(g===" ") return " ";
    const cs=[...g];
    if(cs.some(c=>NEW[i].has(c))) return `<span class="g-hit">${g}</span>`;
    if(cs.some(c=>!KNOWN[i].has(c))) return `<span class="g-dim">${g}</span>`;
    return g;
  }).join("");
}

function db(){ if(!dbP) dbP=new Promise((res,rej)=>{ const r=indexedDB.open("dedar-studio",1); r.onupgradeneeded=()=>r.result.createObjectStore("clips"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbP; }
async function idb(mode,fn){ const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction("clips",mode); const r=fn(t.objectStore("clips")); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }

async function startRec(id){
  try{
    if(!mic) mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){ toast("Microphone is blocked. Allow the microphone for this site, then try again."); return; }
  const types=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4","audio/webm"];
  const mt=types.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t))||"";
  const chunks=[], r=new MediaRecorder(mic, mt?{mimeType:mt}:undefined);
  rec=r; recId=id;
  r.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  r.onstop=async()=>{
    clearTimeout(recTimer); rec=null; recId=null;
    const blob=new Blob(chunks,{type:r.mimeType||mt||"audio/webm"});
    try{ await clipPut(id,blob); recKeys.add(id); toast("Saved ✓"); }catch(e){ toast("Couldn't save. Try again."); }
    studioLessonView();
  };
  r.start(); studioLessonView();
  recTimer=setTimeout(stopRec,8000);
}
function stopRec(){ if(rec && rec.state!=="inactive") rec.stop(); }

const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,sz,true); lh.setUint32(22,sz,true); lh.setUint16(26,name.length,true);
    parts.push(new Uint8Array(lh.buffer),name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,sz,true); ch.setUint32(24,sz,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+sz;
  }
  const cd=central.reduce((x,p)=>x+p.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cd,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
async function downloadZip(){
  const keys=await clipKeys(); if(!keys.length){ toast("Nothing recorded yet."); return; }
  const files=[], list=[];
  for(const k of keys){
    const b=await clipGet(k); if(!b) continue;
    const ext=b.type.includes("ogg")?"ogg":b.type.includes("mp4")?"m4a":"webm";
    files.push({name:`${k}.${ext}`, data:new Uint8Array(await b.arrayBuffer())});
    const m=/^([lw])(\d+)-(\d+)$/.exec(k); const L=m&&LESSONS[+m[2]];
    list.push(`${k}\t${L?(m[1]==="l"?L.letters[+m[3]][0]:L.words[+m[3]][0]):""}`);
  }
  files.push({name:"list.txt", data:new TextEncoder().encode(list.join("\n"))});
  const url=URL.createObjectURL(makeZip(files)), a=document.createElement("a");
  a.href=url; a.download="dedar-recordings.zip"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  toast("Downloaded. Now send dedar-recordings.zip to Claude.");
}

/* Quiz */
const isMark=s=>/^[ऀ-ःऺ-ॏ]$/.test(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function startQuiz(){
  const l=LESSONS[cur];
  const items=[...l.letters.map((x,r)=>({d:x[0],a:x[1],kind:"l",id:`l${cur}-${r}`})).filter(x=>!isMark(x.d)),...l.words.map((w,k)=>({d:w[0],a:w[1],kind:"w",id:`w${cur}-${k}`})).filter(x=>!hasUnknown(x.d,cur))];
  const poolL=LESSONS.flatMap(x=>x.letters.filter(y=>!isMark(y[0])).map(y=>y[1]));
  const poolW=LESSONS.flatMap(x=>x.words.map(y=>y[1]));
  quiz={i:0,score:0,answered:false,qs:shuffle(items).slice(0,5).map(q=>{
    const own=items.filter(x=>x.kind===q.kind&&x.a!==q.a).map(x=>x.a);
    const pool=[...new Set([...shuffle(own),...shuffle(q.kind==="l"?poolL:poolW)])].filter(a=>a!==q.a);
    return {...q,opts:shuffle([q.a,...pool.slice(0,3)])};
  })};
  renderLessonScreen();
  const qb=$("quizBox"); if(qb) qb.scrollIntoView({block:"start"});
}
function quizHTML(){
  if(!quiz) return "";
  const n=quiz.qs.length;
  if(quiz.i>=n){
    const msg=quiz.score===n?"Perfect! Mark this lesson done.":quiz.score>=n-1?"Very good. One more look and you've got it.":"Good try. Read the table once more, then quiz again.";
    return `<div class="quiz" id="quizBox"><div class="q-end"><span class="score">${quiz.score} / ${n}</span><p>${msg}</p>
      <div class="row"><button class="btn quizb" id="qAgain">Quiz again${SUB("again")}</button><button class="btn" id="qClose">Close quiz${SUB("close")}</button></div></div></div>`;
  }
  const q=quiz.qs[quiz.i];
  return `<div class="quiz" id="quizBox">
    <div class="quiz-top"><div><b>Quiz · Lesson ${cur+1}</b>${TR("اِمتِحان","इम्तिहान")}</div><span class="mchip">Question ${quiz.i+1} of ${n} · ✓ ${quiz.score}</span></div>
    <div class="q-prompt">${q.d}<div>${sayBtn(q.d,q.id)}</div></div>
    <p class="q-ask">${q.kind==="w"?"Which Sindhi word is this in Arabic script?":"Which Sindhi letter is this in Arabic script?"}<br>${TR(...(q.kind==="w"?SD.wordq:SD.letterq))}</p>

function bindQuiz(){

/* Reading helper: Sindhi Devanagari -> Sindhi Arabic script. Devanagari writes every vowel, so the letters map exactly.
   Only the hidden "a" (zabar) is optional, because Sindhi Arabic usually leaves it out. */
const DV_CONS={"क":"ڪ","ख":"ک","ग":"گ","ॻ":"ڳ","घ":"گھ","ङ":"ڱ","च":"چ","छ":"ڇ","ज":"ج","ॼ":"ڄ","झ":"جھ","ञ":"ڃ","ट":"ٽ","ठ":"ٺ","ड":"ڊ","ॾ":"ڏ","ढ":"ڍ","ण":"ڻ",
 "त":"ت","थ":"ٿ","द":"د","ध":"ڌ","न":"ن","प":"پ","फ":"ڦ","ब":"ب","ॿ":"ٻ","भ":"ڀ","म":"م","य":"ي","र":"ر","ल":"ل","ळ":"ل","व":"و","श":"ش","ष":"ش","स":"س","ह":"ه"};
const DV_NUKTA={"क":"ق","ख":"خ","ग":"غ","ज":"ز","झ":"ژ","ड":"ڙ","ढ":"ڙھ","फ":"ف"};
const DV_LOWLINE={"ग":"ڳ","ज":"ڄ","ड":"ڏ","ब":"ٻ"};
const DV_PRE={"क़":"ق","ख़":"خ","ग़":"غ","ज़":"ز","ड़":"ڙ","ढ़":"ڙھ","फ़":"ف"};
const DV_MATRA={"ा":"ا","ि":"ِ","ी":"ي","ु":"ُ","ू":"ُو","े":"ي","ै":"َي","ो":"و","ौ":"َو","ृ":"رِ","ॅ":"ي","ॉ":"و"};
const DV_VSTART={"अ":"اَ","आ":"آ","इ":"اِ","ई":"اِي","उ":"اُ","ऊ":"اُو","ए":"اي","ऐ":"اَي","ओ":"او","औ":"اَو","ऋ":"رِ"};
const DV_VMID={"अ":"ءَ","आ":"ئا","इ":"ءِ","ई":"ئي","उ":"ءُ","ऊ":"ءُو","ए":"ئي","ऐ":"ئي","ओ":"ءو","औ":"ءو","ऋ":"رِ"};
const DV_OTHER={"ं":"ن","ँ":"ن","ः":"ه","।":"۔","॥":"۔","?":"؟",",":"،",";":"؛","०":"۰","१":"۱","२":"۲","३":"۳","४":"۴","५":"۵","६":"۶","७":"۷","८":"۸","९":"۹"};
const isDvLetter=c=>!!(DV_CONS[c]||DV_PRE[c]||DV_VSTART[c]);
/* Converts one word. Returns [[Devanagari piece, Arabic piece], ...] split by letter. */
function dvWord(w,zabar){
  const cs=[...w], out=cs.map(()=> "");
  let prev=false;
  for(let i=0;i<cs.length;i++){
    const c=cs[i];
    let base=DV_PRE[c]||null, next=i+1;
    if(!base && DV_CONS[c]){
      if(cs[i+1]==="़" && DV_NUKTA[c]){ base=DV_NUKTA[c]; next=i+2; }
      else if(cs[i+1]==="॒" && DV_LOWLINE[c]){ base=DV_LOWLINE[c]; next=i+2; }
      else base=DV_CONS[c];
    }
    if(base){
      out[i]=base;
      const n=cs[next];
      const hasVowel = n!==undefined && (DV_MATRA[n]!==undefined || n==="्");
      if(!hasVowel && zabar && cs.slice(next).some(isDvLetter)) out[i]+="َ";
      prev=true; continue;
    }
    if(DV_MATRA[c]!==undefined){ out[i]=DV_MATRA[c]; prev=true; continue; }
    if(c==="्"||c==="़"||c==="॒"){ continue; }
    if(DV_VSTART[c]){ out[i]=!prev?DV_VSTART[c]:(c==="इ"&&cs.slice(i+1).some(isDvLetter))?"ئِ":DV_VMID[c]; prev=true; continue; }
    if(DV_OTHER[c]!==undefined){ out[i]=DV_OTHER[c]; continue; }
    out[i]=c;
  }
  const parts=[]; let k=0;
  for(const g of graphemes(w)){ const n=[...g].length; parts.push([g, out.slice(k,k+n).join("")]); k+=n; }
  return parts;
}
function dvText(t,zabar){ return t.split(/(\s+)/).map(x=>/\s/.test(x)||!x?x:dvWord(x,zabar).map(p=>p[1]).join("")).join(""); }

      $("rdDetail").innerHTML=`<div class="rd-parts">${parts.map(([g,a])=>`<span class="rd-p"><span class="dev">${LONE(g)}</span><span class="sheet-arrow">→</span>${a?S(a):'<span class="muted">·</span>'}</span>`).join("")}</div>`;
    });

/* Quick review: letters from finished lessons, both directions. */
let review=null;
function reviewPool(){
  const items=[...done].sort((a,b)=>a-b).flatMap(i=>LESSONS[i].letters.filter(x=>!isMark(x[0])).map(x=>({d:x[0],a:x[1]})));
  const ca={},cd={}; items.forEach(x=>{ ca[x.a]=(ca[x.a]||0)+1; cd[x.d]=(cd[x.d]||0)+1; });
  return items.filter(x=>ca[x.a]===1 && cd[x.d]===1);
}
function startReview(){
  const pool=reviewPool();
  if(pool.length<4){ toast("Finish one lesson first, then review it here."); return; }
  const wk=weakLetters().slice(0,5), rest=shuffle(pool.filter(x=>!wk.includes(x)));
  const qs=shuffle([...wk,...rest].slice(0,8)).map((q,k)=>({...q, flip:k%2===1, opts:shuffle([q,...shuffle(pool.filter(x=>x!==q)).slice(0,3)])}));
  review={qs,i:0,score:0,answered:false,counted:false};
  show("review");
}
function reviewScreen(){
  renderBar("Quick review","2 min");
  if(!review){ screen="home"; render(); return; }
  const n=review.qs.length;
  if(review.i>=n){
    if(!review.counted){ review.counted=true; addDay(); }
    const msg=review.score===n?"Perfect! These letters are sticking.":review.score>=n-2?"Very good. A little more practice and they're yours.":"Good start. Each review makes them stronger.";
    const still=weakLetters().slice(0,6);
    $("view").innerHTML=`<div class="quiz review-box"><div class="q-end"><span class="score">${review.score} / ${n}</span><p>${msg}</p>
      ${still.length?`<p class="muted">Still to practice:</p>${letterChips(still)}`:`<p class="muted">No weak letters right now. Lovely.</p>`}
      <div class="row"><button class="btn quizb" id="rAgain">Review again${SUB("again")}</button><button class="btn primary" id="rHome">Back to home${SUB("home")}</button></div></div></div>`;
    $("rAgain").onclick=startReview; $("rHome").onclick=()=>{ stack=[]; show("home",false); };
    return;
  }
  const q=review.qs[review.i];
  $("view").innerHTML=`<div class="quiz review-box">
    <div class="quiz-top"><div><b>Quick review</b>${TR(...SD.review)}</div><span class="mchip">${review.i+1} of ${n} · ✓ ${review.score}</span></div>
    <div class="q-prompt">${q.flip?S(q.a):q.d}</div>
    <p class="q-ask">${q.flip?"Which Sindhi letter is this in Devanagari?":"Which Sindhi letter is this in Arabic script?"}<br>${TR(...SD.letterq)}</p>
    <div class="q-opts">${q.opts.map((o,k)=>`<button class="q-opt${q.flip?" dev-opt":""}" data-k="${k}" ${q.flip?"":'dir="rtl" lang="sd"'}>${q.flip?LONE(o.d):o.a}</button>`).join("")}</div>
    <p class="q-msg" id="rMsg"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="rNext" hidden>${review.i===n-1?`See my score${SUB("score")}`:`Next →${SUB("next")}`}</button></div>
  </div>`;
  document.querySelectorAll(".q-opt").forEach(b=>b.onclick=()=>{
    if(review.answered) return; review.answered=true;
    const ok=q.opts[+b.dataset.k]===q; if(ok) review.score++; markResult(q.d,ok); buzz(ok);
    document.querySelectorAll(".q-opt").forEach(x=>{ x.disabled=true; if(q.opts[+x.dataset.k]===q) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    const m=$("rMsg"); m.className="q-msg "+(ok?"right":"wrong");
    m.innerHTML=ok?"Correct!":`Not quite. It's ${q.flip?D(q.d):S(q.a)}.`;
    $("rNext").hidden=false; $("rNext").focus();
  });
  $("rNext").onclick=()=>{ review.i++; review.answered=false; reviewScreen(); };
}

  document.querySelectorAll(".mini").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, x=profiles.list.find(y=>y.id===id), row=$("row-"+id);
    if(b.dataset.act==="use"){ switchTo(id); toast(`Now learning: ${personName()}`); }
    else if(b.dataset.act==="ren"){
      row.innerHTML=`<div class="add-form"><label for="ren-${id}">New name</label><input id="ren-${id}" class="name-in" maxlength="20" value="${esc(x.name)}" autocomplete="off"><span class="tp-label">Topi</span>${topiPicker("tpRen",topiOf(x))}<div class="row"><button class="btn primary" id="renYes">Save</button><button class="btn" id="renNo">Cancel</button></div></div>`;
      $("ren-"+id).focus(); $("renNo").onclick=settingsScreen;
      bindPicker("tpRen");
      $("renYes").onclick=()=>{ x.name=$("ren-"+id).value.trim().slice(0,20); x.t=+$("tpRen").dataset.v; saveProfiles(); settingsScreen(); };
    } else {
      row.innerHTML=`<div class="add-form"><p><b>Remove ${esc(personName(x))}?</b> Their lessons and progress will be deleted.</p><div class="row"><button class="btn primary" id="delYes">Yes, remove</button><button class="btn" id="delNo">Cancel</button></div></div>`;
      $("delNo").onclick=settingsScreen; $("delYes").onclick=()=>{ removePerson(id); settingsScreen(); };
    }
  });
  document.querySelectorAll(".seg-b").forEach(b=>b.onclick=()=>{ settings.size=b.dataset.size; save(); applySettings(); settingsScreen(); });
  $("calmBtn").onclick=()=>{ settings.calm=!settings.calm; save(); applySettings(); settingsScreen(); };
  $("setGuide").onclick=()=>show("tour-plan");
  $("resetBtn").onclick=()=>{
    $("resetBox").innerHTML=`<p><b>Are you sure?</b> This can't be undone.</p><div class="row"><button class="btn primary" id="resetYes">Yes, reset</button><button class="btn" id="resetNo">Cancel</button></div>`;
    $("resetNo").onclick=settingsScreen;
    $("resetYes").onclick=()=>{ done=new Set(); seen=new Set(); days=new Set(); weak={}; cur=0; step=0; welcomed=false; quiz=null; match=null; review=null; save(); stack=[]; show("home",false); };
  };
  bindFrogs($("view"));
}

function render(){
  renderNav();
  document.body.classList.toggle("first", screen==="home" && (needPick()||firstRun()));
  if(screen==="home") (needPick()?whoScreen():firstRun()?welcomeScreen():homeScreen());
  else if(screen==="review") reviewScreen();
  else if(screen==="settings") settingsScreen();
  else if(screen==="reader") readerScreen();
  else if(screen==="tour-plan") tourPlan();
  else if(screen==="tour-mouth") tourMouth();
  else if(screen==="tour-extra") tourExtra();
  else if(screen==="outline") outlineScreen();
  else if(screen==="studio") studioScreen();
  else if(screen==="alphabet") alphabetScreen();
  else renderLessonScreen();
}
if(location.hash==="#studio") screen="studio";
window.addEventListener("hashchange",()=>{ if(location.hash==="#studio"){ stack=[]; studioLesson=null; screen="studio"; render(); } });
render();
</script>
<script>
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController && !reloaded){ reloaded=true; location.reload(); } });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
}
</script>
</body>
</html>
